/* ═══════════════════════ H · 非天然氨基酸 / pBpa ═══════════════════════ */
{
  id: 'h1', group: 'H', level: 'core',
  q: 'How does amber suppression work? What are the components?',
  qcn: '琥珀密码子抑制是怎么工作的？需要哪些组件？',
  beats: [
    '把目标位点的密码子改成 TAG（amber）',
    '引入一对正交组件：① 正交 tRNA，反密码子 CUA，识别 TAG；② 正交 aaRS，只给这个 tRNA 上载 ncAA',
    '培养基里补加 ncAA',
    '核糖体读到 TAG 时，正交 tRNA 竞争性地插入 ncAA，而不是被释放因子终止',
    '所以效率取决于和释放因子的竞争'
  ],
  script: 'You recode the position you want as TAG, the amber stop codon, and then supply two orthogonal components: a tRNA whose anticodon is CUA so it reads TAG, and an aminoacyl-tRNA synthetase that charges that tRNA — and only that tRNA — with the non-canonical amino acid, which you feed in the medium. When the ribosome reaches TAG, the suppressor tRNA competes with the release factor. If the tRNA wins, the ncAA is incorporated and translation continues; if the release factor wins, you get a truncated protein. So suppression efficiency is fundamentally a kinetic competition, and it is never one hundred percent.',
  cn: '最后那句是核心洞察：**amber suppression 是一场竞争，不是一个开关**。\n\n在 E. coli 里竞争对手是 RF1；在真核（酵母、哺乳动物）里是 **eRF1**，而且 eRF1 识别全部三个终止密码子，还是必需基因，不能像 E. coli 那样敲掉 RF1 来提高效率。所以真核里的抑制效率通常更低。\n\n**"正交"的两层含义**（h2 会深挖）：\n1. 正交 aaRS 不能给宿主的任何 tRNA 上载\n2. 宿主的任何 aaRS 不能给正交 tRNA 上载\n两个方向都要满足，否则 ncAA 会被随机掺进整个蛋白质组，或者正交 tRNA 会被载上天然氨基酸。\n\n对你的构建体还有一个**特别的问题**要主动提：你的 c-Myc 后面就是终止密码子（原文里 Myc 后接 TAA TAG）。如果你在 linker 引入 amber，同时又有 amber 抑制系统在，那真正的终止密码子也可能被读通。所以真正的终止子应该用 **TAA**，而且最好串两个（TAA TAA）。',
  followups: [
    { q: 'What competes with the suppressor tRNA?', a: '释放因子。E. coli 里是 RF1（识别 UAG 和 UAA）；真核里是 eRF1（识别全部三个终止密码子）。E. coli 可以敲掉 RF1 大幅提高效率（那是 genomically recoded organism 的思路），酵母不行，eRF1 是必需的。' },
    { q: 'Your own stop codon is TAG. Is that a problem?', a: '★ 是的，很好的问题。如果 amber 抑制系统在，构建体真正的终止密码子如果也是 TAG 就会被读通，产生 C 端延长的蛋白。所以要把终止子换成 TAA，而且串联两个（TAA TAA）来降低通读。这个细节说出来很加分。' }
  ],
  lab: null
},
{
  id: 'h2', group: 'H', level: 'killer',
  q: 'You cite a Methanocaldococcus jannaschii pair, and reference [3] is titled "…the genetic code of Escherichia coli". You are working in yeast. Explain.',
  qcn: '你引的是 M. jannaschii 的对，文献 [3] 标题写着大肠杆菌。你做的是酵母。解释一下。',
  beats: [
    '★ 先承认：正交性是相对宿主定义的，换宿主就要换对',
    'MjTyrRS/tRNA 对是在 E. coli 里正交的 —— 这正是 Chin 2002 做的',
    '在 S. cerevisiae 里，标准的正交对是 E. coli TyrRS / tRNA^Tyr_CUA（Chin et al., Science 2003）',
    '因为古菌的 TyrRS 和真核的 tRNA^Tyr 识别元件更接近，正交性在酵母里不成立',
    '所以我在酵母里应该用 E. coli 来源的对，我的写法在这一点上不严谨'
  ],
  script: 'That is a fair hit, and I should correct it. Orthogonality is defined relative to a host — a pair is orthogonal only if the host\'s synthetases ignore its tRNA and its synthetase ignores the host\'s tRNAs. The Methanocaldococcus jannaschii TyrRS/tRNA pair is orthogonal in E. coli, which is exactly what reference three demonstrates. For Saccharomyces cerevisiae the established pair is the E. coli TyrRS with E. coli tRNA-Tyr-CUA, from the 2003 Science paper by the same group — the archaeal synthetase does not stay orthogonal against the eukaryotic translation machinery. So in yeast I should have specified the E. coli-derived pair. The rest of the design — amber codon, pBpa fed in the medium, UV crosslinking — is unchanged; only the source organism of the orthogonal pair is wrong.',
  cn: '★★★ **这是全篇最可能被抓的硬伤，必须练到能平静地接住。**\n\n核心概念：**正交性不是分子的属性，是分子和宿主之间关系的属性。** 换宿主，正交性就要重新验证。一般规律是"选进化上离宿主远的来源"：\n- 在 **E. coli**（细菌）里 → 用**古菌**来源（MjTyrRS）\n- 在 **酵母/哺乳动物**（真核）里 → 用**细菌**来源（EcTyrRS）\n\n这个规律本身就是很漂亮的答案——它解释了为什么不能简单照搬。\n\n**接话的姿态**（这决定了这一刀是扣分还是加分）：\n1. 立刻承认，不辩解（"That is a fair hit"）\n2. 说出正确答案，并解释**为什么**是这样（正交性相对宿主）\n3. 明确划定错误的边界：只有来源生物错了，设计逻辑没错\n\n第 3 步很重要——它防止考官把这一个错误扩大成"整段都没想清楚"。\n\n**诚实说明**：我对 "酵母用 E. coli TyrRS/tRNA 对"（Chin et al., Science 2003, 301:964）这一点有较高把握，但你上考场前值得自己核一遍原文——CLAUDE.md 里说了，不能核实的引用要标出来而不是放过去。这条我标出来了。',
  followups: [
    { q: 'What is the general rule for picking an orthogonal pair?', a: '选一个进化距离宿主远的来源。tRNA 的识别元件（identity elements）在进化上保守，所以近缘生物的 aaRS/tRNA 会交叉识别。细菌宿主用古菌来源，真核宿主用细菌来源——这就是为什么 Mj 对在 E. coli 里行、在酵母里不行。' },
    { q: 'How would you verify orthogonality experimentally?', a: '两个方向各测一个：① 只转 aaRS、不加 ncAA，看有没有把天然氨基酸掺进 amber 位点（如果有，说明它认了宿主的氨基酸或宿主 tRNA）；② 只转 tRNA、不转 aaRS，看 amber 位点有没有被读通（如果有，说明宿主的 aaRS 给它上载了）。两个对照都干净，才叫正交。' }
  ],
  trap: '★ 千万别硬撑说 "M. jannaschii 的对在酵母里也能用"。承认错误 + 给出正确答案 + 解释原理，这一刀会变成你全场最亮的时刻。硬撑则会变成最糟的时刻。',
  lab: null
},
{
  id: 'h3', group: 'H', level: 'core',
  q: 'What does pBpa do under UV? Give me the chemistry.',
  qcn: 'pBpa 在紫外下干什么？讲化学机制。',
  beats: [
    'pBpa = p-benzoyl-L-phenylalanine，侧链是二苯甲酮（benzophenone）',
    '~365 nm 长波紫外激发',
    '羰基 n→π* 跃迁 → 系间窜越到三线态双自由基',
    '三线态羰基氧夺取邻近的 C–H 氢原子',
    '两个自由基复合 → 形成共价 C–C 键',
    '关键优势：如果附近没有 C–H 可夺，它会回到基态，可以反复尝试'
  ],
  script: 'The side chain is a benzophenone. Long-wave UV around 365 nanometres promotes the carbonyl to an n-to-pi-star excited state, which crosses over to a triplet diradical. The triplet carbonyl oxygen abstracts a hydrogen atom from a nearby aliphatic C–H bond, and the two resulting radicals recombine to form a covalent carbon–carbon bond. Two things make benzophenone good for this. First, 365 nanometres is gentle — it does not damage the protein or the cell the way shorter UV does. Second, it is reversibly activatable: if there is no C–H within reach, it simply relaxes back to the ground state and can be excited again, so it keeps sampling until it finds a partner. An aryl azide, by contrast, fires once and is consumed.',
  cn: '★ 那个 "reversibly activatable" 的优势是 benzophenone 化学最漂亮的一点，**一定要说**——它是 benzophenone 成为标准光交联剂的原因。\n\n对比其它光交联基团：\n- **芳基叠氮 (aryl azide)**：短波 UV (254–300 nm)，产生氮宾，一次性消耗，而且短波伤蛋白\n- **双吖丙啶 (diazirine)**：~350 nm，产生卡宾，反应性极高（连 O–H 都插入），但半衰期极短、也是一次性\n- **二苯甲酮 (benzophenone)**：365 nm，可反复激发，选择性夺 C–H\n\n**作用距离约 3 Å** —— 这意味着交联报告的是真正的紧密接触，不是"附近"。这个数字值得记，因为它决定了 h4 里"交联到什么"的答案。',
  followups: [
    { q: 'Why 365 nm and not 254?', a: '254 nm 会被蛋白质的芳香族残基和核酸强烈吸收，造成光损伤（想想 UV 灭菌的原理）。365 nm 在生物分子的吸收窗口之外，细胞能耐受几分钟到几十分钟的照射。' },
    { q: 'What is the reach?', a: '约 3 Å——非常短。所以交联成功意味着真正的分子接触，不是"在同一个区域"。这既是优点（特异性高）也是限制（必须把 pBpa 放对位置）。' }
  ],
  lab: null
},
{
  id: 'h4', group: 'H', level: 'deep',
  q: 'What exactly would pBpa crosslink to? And how would you know it worked?',
  qcn: 'pBpa 到底交联到什么上？你怎么知道成功了？',
  beats: [
    '★ 先诚实：原文写的是 "the nearby scaffold"，这不够具体',
    '候选伙伴：Aga2p 自身、Aga1p、或者细胞壁的甘露糖蛋白',
    '3 Å 的作用距离意味着必须真的贴着——不能靠猜，要试',
    '实际做法：在 linker 里扫描多个位置，看哪个位置交联效率最高',
    '怎么知道成功：① 蛋白酶挑战后 c-Myc 信号保住了；② western 上出现高分子量的移位条带；③ 关键——不照 UV 的对照必须没有这个效果'
  ],
  script: 'Honestly, my write-up says "the nearby scaffold", which is not specific enough. The realistic partners are Aga2p itself, Aga1p, or a cell wall mannoprotein — but the reach is only about three ångströms, so I cannot reason my way to the right position. I would scan: put the amber codon at several different positions along the linker and measure which one gives the best crosslink. As for knowing it worked, three readouts. Functionally, the c-Myc signal should survive the protease challenge with UV and not without. Biochemically, a western blot should show a shifted, higher-molecular-weight band appearing only after irradiation. And the essential control is the minus-UV sample, processed identically — if the retention is there without UV, the effect is not photocrosslinking.',
  cn: '★ 开头就承认 "the nearby scaffold is not specific enough" 是正确姿态。这是原文里一个真实的含糊处，考官读到 "nearby scaffold" 一定会问 "nearby what"。\n\n**为什么必须扫描而不是设计**：3 Å 是原子接触的距离。你无法从序列推断展示构建体上哪个残基恰好贴着 Aga1p 的哪个残基——那需要结构。所以正确做法是把 amber 位点在 linker 上逐个移动（position scanning），实验找出哪个位置有效。这本身就是一个小型的定向进化。\n\n**−UV 对照是不可协商的**。如果不照 UV 也保住了 c-Myc，那说明是别的原因（比如 pBpa 这个大疏水侧链本身就降低了蛋白酶可及性）。这个对照把"光化学交联"和"侧链效应"分开。\n\n还有一个漂亮的**反向逻辑**：如果 pBpa 交联成功了，那被交联住的部分**即使 linker 被切了也还留在细胞上**。所以你实际上是在测 "切了但没掉"，这和主筛选测的"没被切"是不同的机制。这一点值得主动讲——它说明 ncAA 这条路是**正交的第二道保险**，不是同一个东西的重复。',
  followups: [
    { q: 'Why is this a second mechanism rather than more of the same?', a: '主筛选让 linker **不被切**；pBpa 让构建体**即使被切也不掉**。第一个是抗性，第二个是冗余锚定。两者失效模式不同，所以叠加起来是真的更稳，而不是同一保险买两份。' },
    { q: 'What if crosslinking to Aga1p disrupts display?', a: '有可能——把柔性 linker 钉死在近端会严重限制抗原的活动范围，正好落进 Possible Problem #1（i1）。所以交联后必须重新测抗原可及性。这条路径不是免费的。' }
  ],
  lab: null
},
{
  id: 'h5', group: 'H', level: 'deep',
  q: 'Why did you keep the ncAA work as a follow-up rather than part of the selection?',
  qcn: '为什么把非天然氨基酸那部分放成后续，不放进筛选？',
  beats: [
    '效率问题：amber 抑制不完全，一部分细胞得到截短蛋白',
    '截短的表型（HA+/c-Myc−）和"被切断"完全一样 —— 混淆读数',
    '而且每个细胞的抑制效率有差异，会给比值加一层与 linker 无关的噪声',
    '还有：额外的正交对质粒 + ncAA 培养基 = 多一层文库层面的变量',
    '所以先用天然氨基酸把 linker 选定，再在赢家上做 ncAA —— 一次改一个变量'
  ],
  script: 'Because it would corrupt the readout. Amber suppression is never complete, so a fraction of cells terminate at the amber codon and make a truncated construct — HA positive, c-Myc negative. That is indistinguishable from a cleaved linker. Worse, suppression efficiency varies cell to cell, so it would add variance to the ratio that has nothing to do with protease resistance. On top of that it means a second plasmid for the orthogonal pair and a special medium, both of which add library-level variables. The clean design is to select the linker with canonical amino acids, where the readout means what I say it means, and then introduce pBpa into the winner. One variable at a time.',
  cn: '★ "amber 截短的表型和被切断的表型完全一样" 是这题的核心，而且是一个**很锐利的观察**。\n\n想清楚：两种情况下细胞都是 HA 阳性、c-Myc 阴性。流式分不出来。所以如果在筛选阶段引入 amber，你的低比值群里混着两种完全不同的东西，选择压就被稀释了。\n\n第二层（抑制效率的细胞间差异）更微妙：即使抑制成功的细胞，成功的程度也不一样，这直接给比值加了一层噪声——而且这层噪声和 linker 序列无关，纯粹是干扰。\n\n**"one variable at a time"** 是实验设计的基本纪律，这里用得恰到好处。原文里那句 "I would treat this as a follow-up rather than part of the main selection" 本身就是对的判断，口试时要能说出**为什么**对。',
  followups: [
    { q: 'Could you select for high suppression efficiency at the same time?', a: '技术上可以（比值高既可能是 linker 好、也可能是抑制效率高），但那正是问题所在——你会同时在选两个性质，而且分不清哪个在起作用。如果真想要，应该分开做：先固定 linker，再单独筛抑制效率。' }
  ],
  lab: null
},

/* ═══════════════════════════ I · 对照与失败 ═══════════════════════════ */
{
  id: 'i1', group: 'I', level: 'core',
  q: 'Your first problem: a rigid linker protects itself by hiding the antigen. How do you catch that?',
  qcn: '你的问题一：刚性 linker 靠把抗原藏起来自保。怎么抓出来？',
  beats: [
    '关键洞察：选择压和真实目标错位了',
    '我选的是"c-Myc 留下来"，我要的是"抗原露得出来"',
    '抓法：用抗-抗原的构象特异性抗体染选出来的单克隆',
    '如果抗原信号相对野生型明显下降 → 剔除',
    '更好的办法：把这个测量提前，做成分选的第三个通道'
  ],
  script: 'The problem is a mismatch between what I select for and what I actually want: I select for c-Myc surviving, but what I want is an antigen that an immune system can see. A linker that pulls the antigen down against the cell wall could score perfectly and be useless. I catch it by staining the selected clones with a conformation-specific antibody against the antigen itself and comparing to the wild-type linker — anything with substantially reduced accessibility gets excluded. Better still, I could bring that measurement forward and make it a third colour during the sort, so I select on the ratio and on antigen accessibility simultaneously, instead of selecting first and filtering afterwards.',
  cn: '★ 最后那个升级（**把抗原可及性做成第三个通道，在分选时就一起筛**）是这题的高分点。原文只写了"筛完再测"，但更好的设计是"筛的时候就一起测"。\n\n为什么更好：事后筛选只能从已经富集的东西里挑，如果所有富集出来的都藏抗原，你就一无所获。三色分选直接把"抗切 AND 可及"作为联合条件，选择压从一开始就指向真正的目标。\n\n代价要诚实说：三色需要第三个荧光基团、更多补偿、以及一个好的构象特异性抗-抗原抗体（后者不一定有）。所以这是"如果条件允许"的升级，不是无脑更优。\n\n**术语值得用**：这是典型的 "you get what you select for" —— 定向进化里最著名的教训。选择压永远精确地给你你写下的那个条件，不是你心里想的那个。',
  followups: [
    { q: 'What if no conformational antibody exists for your antigen?', a: '退而求其次：用受体或已知的中和抗体做探针（如果抗原有天然结合伙伴），或者用多克隆血清测总体可及性。再不行就用蛋白酶可及性本身作为间接指标——但那就绕回原问题了，要承认这是个限制。' },
    { q: 'Is a shorter linker necessarily worse for accessibility?', a: '不一定。有文献显示 linker 长度对展示蛋白的功能影响是非单调的。所以不能预设"短=差"，要测。这也是为什么要测量而不是排除掉短的候选。' }
  ],
  lab: '技术 7（CytoFLEX 分析单克隆）+ 技术 1。你验证单克隆的流程正好可以用来做这个可及性测量。'
},
{
  id: 'i2', group: 'I', level: 'core',
  q: 'Your second problem: selection acts on the cell, not the linker. Design that control precisely.',
  qcn: '你的问题二：选择作用在细胞而不是 linker 上。把那个对照设计具体。',
  beats: [
    'spike-in 参考株：固定的野生型 linker + 组成型表达的 mCherry（或其它不占用你两个通道的荧光蛋白）',
    '按已知比例（比如 1%）掺进文库，全程跟着走',
    '它同时报告两件事：① 每轮之后它占的比例 = 整体存活/回收；② 它自己的 c-Myc/HA = 读数有没有漂移',
    '如果它的比例暴涨 → 文库整体死得比它多 → 选择在细胞层面起作用',
    '如果它的 ratio 每轮都不同 → 染色/仪器漂移，不是生物学'
  ],
  script: 'A spike-in reference strain: fixed wild-type linker, plus a constitutive fluorescent protein in a channel I am not using — mCherry, say, since my two tags are in the 488 and 640 channels. I add it to the library at a known fraction, say one percent, and it goes through every round with everything else. It gives me two independent readouts. Its fraction after each round tells me about general survival — if the reference goes from one percent to twenty, the library is dying faster than the reference and something cell-level is being selected. And its own c-Myc-to-HA ratio should be constant across rounds; if it drifts, that is staining or instrument drift, not biology, and I need to renormalise. So it is simultaneously a survival control and an internal standard for the readout.',
  cn: '★ 这题的关键是把原文那句含糊的 "a different fluorescent marker" 变成一个**可执行的设计**，并说清它**同时提供两个独立读数**。\n\n两个读数的分工：\n1. **比例变化** → 群体层面：文库整体是不是被非特异地杀掉了\n2. **自己的 ratio** → 技术层面：染色和仪器有没有漂移\n\n第二个读数尤其重要，因为你的选择跨越多轮、多天，染色批次和仪器设置都会变。一个 ratio 应该恒定的内参，让你能把每一轮的数据放到同一个尺度上比较。\n\n**荧光通道选择**要说清楚：mCherry（561 nm 激发）不占用 488 和 640，所以不干扰你的两个 tag 通道。这个细节显示你在设计层面考虑了兼容性。\n\n**加多少**：1% 是个好起点——足够被可靠计数（分选 20,000 事件里有 200 个），又不至于占掉太多文库容量。',
  followups: [
    { q: 'What if the reference strain itself behaves atypically?', a: '合理的担心。可以掺两株不同的参考（一株野生型 linker、一株已知抗切的），互相印证。如果两株给出一致的存活趋势，那趋势就是真的。' },
    { q: 'How does this differ from the mock-treated arm?', a: 'mock 臂是**平行的另一管**，回答"不加酶会怎样"。spike-in 是**同一管里的内参**，回答"这一管里非特异效应有多大"。前者控制批次间，后者控制批次内。两个都要，不能互相替代。' }
  ],
  lab: '技术 6（多色分选）+ 技术 1（荧光标记）。'
},
{
  id: 'i3', group: 'I', level: 'deep',
  q: 'Suppose almost everything dies in round one. What do you do?',
  qcn: '假设第一轮几乎全死了。你怎么办？',
  beats: [
    '先分清两件事：细胞死了，还是 c-Myc 都掉了？两者处理方式完全不同',
    '如果是细胞死了 → pH/温度太狠 → 降低胃段强度，或先测存活曲线',
    '如果是细胞活着但都低比值 → 蛋白酶太狠 → 降浓度/缩时间',
    '不要一上来就重建文库 —— 先滴定（e5）',
    '如果滴定后温和条件下仍然没有分离出的高比值群 → 那才是文库问题'
  ],
  script: 'First I would find out which "died" I am looking at, because they need opposite responses. If the cells are actually dead or lysed, that is the acid and temperature, and I fix it by shortening the gastric stage or checking a viability curve — and I would know because the FSC/SSC plot loses the intact-cell population and gains debris. If the cells are intact but the whole population has collapsed to low ratio, that is the proteases being too aggressive, and I reduce concentration or time. Only if a properly titrated, mild challenge still produces no separated high-ratio population would I conclude the library is the problem — and then the fix is more positions, or a biased alphabet, or simply a bigger transformation.',
  cn: '★ 这题真正在考的是 **诊断能力**：同一个现象（"全死了"）有两个完全不同的原因，处理方式相反。能先区分再行动，比直接给方案更值钱。\n\n**区分的依据是 FSC/SSC 图**：细胞死亡/裂解 → 完整细胞群消失、碎片增多；细胞完好但被切 → 完整细胞群还在，只是都往低比值移。这是两个可以直接看出来的不同图像。\n\n这也正是 CLAUDE.md 里那条纪律的应用：**"一个信号符合某个已知失败模式，不代表原因就是那个"** —— 先确认证据支持这个具体动作，再动手。\n\n原文的答案（"先测一系列浓度和时间"）是对的，但口试要能说出**先诊断再滴定**这个更完整的顺序。',
  followups: [
    { q: 'How would the FSC/SSC plot tell you?', a: '完整酵母在 FSC/SSC 上是一个致密的群。裂解后这个群缩小甚至消失，左下角碎片区膨胀。所以只要看第一个门里还剩多少事件，就知道是不是细胞层面的问题。' }
  ],
  lab: '技术 6.6（FSC/SSC 圈活细胞群）。'
},
{
  id: 'i4', group: 'I', level: 'deep',
  q: 'What single experiment would most convincingly falsify your whole scheme?',
  qcn: '哪一个实验最能证伪你的整个方案？',
  beats: [
    '这样一个实验：拿一条已知抗蛋白酶的 linker 和野生型 (G4S)，分别做成单克隆',
    '走完整套流程：诱导 → 挑战 → 灭活 → 染色 → 流式',
    '看它们的 c-Myc/HA 分布分不分得开',
    '如果分不开 → 整个读数不成立，后面所有都是白做',
    '这是必须最先做的实验，不是最后'
  ],
  script: 'Take two clones — the wild-type G4S linker and one with a linker I have good reason to think is resistant, a proline-rich one — and run both through the entire pipeline: induction, gastric stage, intestinal stage, quench, stain, flow. If their c-Myc-to-HA distributions do not separate, then the readout does not resolve the property I am selecting on, and no amount of library or sorting will fix that. Everything downstream is built on that one assumption. So it is not the experiment I would do to falsify the scheme at the end — it is the first experiment I would do, before building a library at all.',
  cn: '★★ "这是第一个实验，不是最后一个" —— 这句话是这题的全部价值。\n\n这是**assay 开发先于文库构建**的原则。绝大多数定向进化项目失败不是因为文库不好，是因为读数分辨不出要选的性质。先用两个已知的极端把 assay 的**动态范围**测出来，再花钱建库。\n\n它同时充当：\n- **阳性对照**（抗切克隆）\n- **阴性对照**（野生型）\n- **动态范围测定**（两者的分离度就是你的信噪比）\n\n如果两者分开得很好（比如分布中位数差 5 倍），你就知道 assay 能分辨。如果只差 20%，那这个 assay 分辨不了细微差别，选择效率会很低。\n\n**这也回答了"你的阈值有什么证据"**——门的位置应该放在这两个已知群体之间的空隙里。CLAUDE.md 第一条：阈值在两个分离群体之间的空隙里才不敏感。',
  followups: [
    { q: 'Where would you get a "known resistant" linker?', a: '文献里有报道的抗蛋白酶肽段，或者干脆自己设计一条富 Pro 的（按 c2 的机制，它应该抗切）。它不需要是最优的——只需要和野生型有可检测的差别，用来定义动态范围。' },
    { q: 'What if they separate but only slightly?', a: '那说明 assay 能分辨但分辨率低。可以加压（更狠的挑战放大差别）、或者改进读数（比如换更亮的荧光基团提高信噪比）。也要相应调低对第一轮富集倍数的预期。' }
  ],
  lab: '技术 7（CytoFLEX：分析不分选，正适合做这种 assay 开发）。'
},
{
  id: 'i5', group: 'I', level: 'deep',
  q: 'After three rounds one sequence dominates the pool. Are you happy?',
  qcn: '三轮之后一条序列占了绝大多数。你高兴吗？',
  beats: [
    '警惕，不是高兴',
    '单一序列主导可能是真赢家，也可能是"跑得快的搭便车者"',
    '第一件事：查它在 mock 臂里的频率。mock 里也富集 → 生长优势，不是抗性',
    '第二件事：查它的 linker 序列合不合理（有没有终止子、有没有丢掉随机化区）',
    '第三件事：重新构建这个单克隆，从头跑一遍 assay 验证',
    '而且真正有信息量的不是冠军，是排名前 50 的共同特征'
  ],
  script: 'Wary, not happy. A single dominant sequence is as consistent with a fast-growing hitchhiker as with a genuine winner. So: first, look up its frequency in the mock-treated arm — if it enriched there too, it is growth, not resistance. Second, check the sequence itself makes sense: no stop codon, the randomised region intact, no vector artefact. Third, rebuild that clone from scratch and re-run the assay on it in isolation, because enrichment in a pool and performance as a clone are different claims. And honestly, the most informative output is not the champion at all — it is what the top fifty sequences have in common. One sequence is an anecdote; a shared motif across fifty independently enriched sequences is a result.',
  cn: '★★ 最后那句是这一整组题里最重要的科学判断：**一条序列是轶事，五十条序列的共同特征才是结果。**\n\n这直接对应 CLAUDE.md 里那条已经犯过的错：\n> "报告了一个按 count 排序的频率表。它读起来像是所有东西都塌缩到两对亲本上了。实际上那两对里面包含 10 个和 8 个不同的序列、断点位置不同——是独立事件。"\n\n同样的教训：**不要被计数排序骗了**。要看的是多样性和共同特征，不是谁的计数最高。\n\n"enrichment in a pool and performance as a clone are different claims" 也很关键——池子里的富集是相对的、受群体组成影响的；单克隆的性能是绝对的。必须单独验证。这也正是你自己 RBD 项目里做 27 个单克隆 Sanger 验证的原因。\n\n还有一个具体的**载体假象**要查：如果线性化不完全，残留的环状母本质粒会转化出**野生型 linker** 的克隆。这些克隆不带随机化区，如果它们碰巧长得快，就会主导池子——而且看起来像"选出了一条特定序列"。查序列就能立刻发现。',
  followups: [
    { q: 'What would a healthy result look like instead?', a: '几十到上百条不同序列显著富集，它们之间共享可识别的特征——比如某几个位置强烈偏好 Pro，或者整体电荷分布有规律。有 motif 才能说出"为什么抗切"，才有推广价值。单个赢家只能告诉你"这一条行"。' },
    { q: 'How do you find the motif?', a: '把富集的序列按位置做频率矩阵（sequence logo），和 round 0 的频率比较。每个位置计算氨基酸的富集倍数，看哪些位置有强偏好、偏好什么性质（疏水性、电荷、体积）。这是深度突变扫描的标准分析。' }
  ],
  trap: null,
  lab: '技术 10.7 + CLAUDE.md 里"频率表按 count 排序"那个已犯过的错。这是你的项目里真实踩过的坑，讲出来非常有说服力。'
},
{
  id: 'i6', group: 'I', level: 'killer',
  q: 'Your readout cannot distinguish cleavage in the linker from cleavage in the antigen. Does your selection still mean anything?',
  qcn: '你的读数分不出切在 linker 还是切在抗原里。那你的选择还有意义吗？',
  beats: [
    '有意义，而且理由是干净的：变异只发生在 linker 上',
    '抗原对所有变体完全相同 —— 它构成恒定背景，不是变量',
    '所以变体之间比值的差异，只可能来自 linker 的差异',
    '抗原的切割给所有细胞加了同一个底噪，降低动态范围，但不引入偏倚',
    '代价要承认：它压缩了信噪比，可能让弱的差别测不出来'
  ],
  script: 'It still means something, and the argument is about where the variation is. The antigen is identical in every cell in the library — it is a constant, not a variable. So while cleavage inside the antigen certainly happens and certainly lowers c-Myc, it does so equally across all variants. It is a uniform background, not a confounder: differences in ratio between variants can only come from the one thing that differs between them, which is the linker. What it does cost me is dynamic range. If the antigen is heavily cleaved, everyone\'s c-Myc is low and the differences I am trying to resolve sit on top of a large common loss. That would show up as poor separation in the assay development experiment, and if it did, I would need a more protease-tolerant antigen or a shorter challenge.',
  cn: '★★ 这是一记很聪明的刀，而且答案也很漂亮：**因果归属由变异源决定。**\n\n这是遗传学里的基本论证：如果两组之间只有一个变量不同，那么观察到的差异只能归因于那个变量。抗原是恒定的，所以它不可能造成变体之间的差异——它只能影响所有变体的共同水平。\n\n**混淆因素 vs 背景**的区别值得讲清楚：\n- **混淆因素 (confounder)**：和你的变量相关，会造成虚假的组间差异\n- **均匀背景 (uniform background)**：对所有组一样，降低信噪比但不造成虚假差异\n\n抗原切割是后者，不是前者。这个区分本身就是很强的统计思维。\n\n**但要诚实承认代价**：动态范围被压缩。如果抗原被切得很厉害，所有细胞的 c-Myc 都低，你要分辨的 linker 差异就淹没在这个共同损失里了。而且这个问题**会在 i4 的 assay 开发实验里暴露出来**——如果野生型和抗切对照分不开，可能就是这个原因。两题接得上。',
  followups: [
    { q: 'How would you check whether the antigen is being heavily cleaved?', a: 'western blot：挑战前后都跑，用抗-HA 探针看细胞上残留片段的分子量分布。如果出现一条比 linker 切割预期更长的中间片段，那就是抗原内部被切了。或者收上清做质谱，直接读切割产物的末端序列。' },
    { q: 'Would a more stable antigen change your conclusions?', a: '不会改变选择的有效性（变异源还是只在 linker），但会提高动态范围，让弱的 linker 差异也测得出来。所以选一个本身较稳定的抗原是有好处的——这是设计层面的考虑，不是补救。' }
  ],
  trap: null,
  lab: null
},

/* ═══════════════════════════ J · 大局与文献 ═══════════════════════════ */
{
  id: 'j1', group: 'J', level: 'core',
  q: 'Reference [1], Boder and Wittrup 1997. What did it actually show?',
  qcn: '文献 [1]，Boder 和 Wittrup 1997。它到底证明了什么？',
  beats: [
    '它建立了酵母表面展示这个系统本身',
    '用 Aga2p 融合把蛋白展示到细胞壁上',

{ en: 'Protease / peptidase', cn: '蛋白酶', group: 'protease',
  match: ['protease', '蛋白酶'],
  def: '水解肽键的酶。**内肽酶**（endopeptidase）从链中间切，**外肽酶**（exopeptidase）从末端一个个啃。按催化机制分成丝氨酸、天冬氨酸、半胱氨酸、金属蛋白酶等大类——机制决定了它需要什么 pH，这是口试常考的联动。' },

{ en: 'Pepsin', cn: '胃蛋白酶', group: 'protease',
  match: ['pepsin', '胃蛋白酶'],
  def: '**天冬氨酸**蛋白酶，活性位点两个 Asp（一个质子化、一个去质子化协同活化水分子），所以需要极酸的 pH 1.5–2.5。偏好疏水/芳香族残基（Phe、Leu、Trp、Tyr）。pH > 7 失活、> 8 不可逆——这就是你终止胃段的办法。' },

{ en: 'Aspartic protease', cn: '天冬氨酸蛋白酶', group: 'protease',
  match: ['aspartic protease', '天冬氨酸蛋白酶'],
  def: '靠两个天冬氨酸残基催化的一类蛋白酶，必须在酸性下工作。代表：pepsin、HIV protease、renin、cathepsin D。把 pepsin 说成丝氨酸蛋白酶是常见错误——那样就解释不了它为什么需要 pH 2。' },

{ en: 'Serine protease', cn: '丝氨酸蛋白酶', group: 'protease',
  match: ['serine protease', '丝氨酸蛋白酶'],
  def: '靠 Ser-His-Asp **催化三联体**工作：His 当碱夺走 Ser 的质子，活化的 Ser 氧原子亲核进攻底物羰基碳，形成共价的酰基-酶中间体，再被水解掉。trypsin、chymotrypsin、elastase 都属于这一类，最适 pH 偏碱。' },

{ en: 'Catalytic triad', cn: '催化三联体', group: 'protease',
  match: ['catalytic triad', '催化三联体'],
  def: 'Ser-His-Asp 三个残基在空间上靠拢形成的催化中心。Asp 通过氢键稳定质子化的 His，His 活化 Ser，Ser 完成亲核进攻。生化里最经典的机制之一，值得能画出来。' },

{ en: 'Trypsin', cn: '胰蛋白酶', group: 'protease',
  match: ['trypsin', '胰蛋白酶'],
  def: '丝氨酸蛋白酶，特异性最窄：只切 Lys 和 Arg **之后**（C 端侧），而且下一位是 Pro 时不切。最适 pH ~8。它的窄特异性正是"理性设计躲得开它、躲不开别的"这个论证的起点。' },

{ en: 'Chymotrypsin', cn: '胰凝乳蛋白酶', group: 'protease',
  match: ['chymotrypsin', '胰凝乳蛋白酶'],
  def: '丝氨酸蛋白酶，切芳香族残基之后：Phe、Trp、Tyr，对 Leu 和 Met 慢一些。注意它和 pepsin 的偏好**重叠**——这就是作业里"partly overlapping specificities"的具体所指。' },

{ en: 'Elastase', cn: '弹性蛋白酶', group: 'protease',
  match: ['elastase', '弹性蛋白酶'],
  def: '丝氨酸蛋白酶，切**小残基**之后：Ala、Gly、Val、Ser。这一条对本课题特别要命——标准柔性 linker (G4S)ₙ 全是 Gly 和 Ser，正好是它的理想底物。所以"躲开 K/R/芳香族"剩下的残基恰恰落进它的口味。' },

{ en: 'Pancreatin', cn: '胰酶混合物', group: 'protease',
  match: ['pancreatin', '胰酶'],
  def: '从胰腺提取的酶混合物：trypsin、chymotrypsin、elastase、羧肽酶，外加淀粉酶和脂肪酶（后两者与你无关）。三种内肽酶的偏好互补，加起来覆盖碱性、芳香族、小残基三大类残基。' },

{ en: 'Carboxypeptidase', cn: '羧肽酶', group: 'protease',
  match: ['carboxypeptidase', '羧肽酶'],
  def: '**外**肽酶，从蛋白的 C 端一个残基一个残基往回啃。A 型偏好芳香/疏水末端，B 型偏好 Lys/Arg。在你的构建体里值得注意：c-Myc 就在最 C 端，外肽酶啃它不需要先切 linker。' },

{ en: 'Zymogen', cn: '酶原', group: 'protease',
  match: ['zymogen', '酶原', 'pepsinogen'],
  def: '无活性的酶前体，需要切掉一段前肽才激活。pepsin 以 pepsinogen 分泌，遇酸后自催化切掉前肽；胰酶以 trypsinogen 等形式分泌，进小肠才被激活。目的是防止腺体自我消化。' },

{ en: 'P1 / P1′ (Schechter–Berger)', cn: '底物位点命名法', group: 'protease',
  match: ['P1', 'Schechter'],
  def: '描述底物哪一位在被切。以切割位点为界，N 端侧依次是 P1、P2…，C 端侧是 P1\'、P2\'…；酶上对应的口袋叫 S1、S1\'。"trypsin 切 Lys/Arg 之后"的严谨说法就是"P1 是 Lys 或 Arg"。' },

{ en: 'Quenching / inactivation', cn: '灭活 · 淬灭', group: 'protease',
  match: ['quenching', 'quenched', 'quench', '灭活'],
  def: '把酶反应停下来。pepsin 靠把 pH 提到 8（不可逆变性），胰酶靠加抑制剂（AEBSF、大豆胰蛋白酶抑制剂）再冰冷洗涤。**染色前必须做**——抗体也是蛋白，不灭活就加抗体，抗体会被切碎，你测到的是残留酶活而不是 linker。' },

{ en: 'AEBSF / PMSF', cn: '丝氨酸蛋白酶抑制剂', group: 'protease',
  match: ['AEBSF', 'PMSF'],
  def: '都共价不可逆地修饰活性位点的丝氨酸。AEBSF（4-(2-氨基乙基)苯磺酰氟）比 PMSF 水溶性好、在水里更稳定、毒性低；PMSF 半衰期短且要用异丙醇溶。它们只认丝氨酸蛋白酶，所以不影响抗体。' },

{ en: 'SGF / SIF', cn: '模拟胃液 / 模拟肠液', group: 'protease',
  match: ['SGF', 'SIF'],
  def: 'USP 药典的标准配方。SGF：pepsin 3.2 g/L、NaCl 2 g/L、HCl 调 pH 1.2–2.0。SIF：pancreatin 10 g/L、磷酸钾缓冲、pH 6.8。都在 37 °C。报得出具体配方，比说"acidic, gastric-like"专业得多。' },

/* ═══════════════════════ 流式与分选 ═══════════════════════ */
{ en: 'FACS', cn: '荧光激活细胞分选', group: 'flow',
  match: ['FACS'],
  def: 'Fluorescence-activated cell sorting。细胞排成单列逐个过激光，测完散射和荧光后，靠给液滴充电、经高压偏转板把目标细胞物理分到收集管里。"定量 + 活细胞分选"二合一，这是它不可替代的地方。' },

{ en: 'Analytical flow cytometry', cn: '分析型流式', group: 'flow',
  match: ['CytoFLEX', '分析型流式'],
  def: '只测量、不分选的流式（你用的 CytoFLEX 属于这类）。适合验证单克隆、做 assay 开发、画滴定曲线。要把细胞活着分出来继续培养，才需要 FACS。' },

{ en: 'Hydrodynamic focusing', cn: '流体动力学聚焦', group: 'flow',
  match: ['hydrodynamic focusing', '流体动力学聚焦', '鞘液'],
  def: '样品流被更快的鞘液（sheath fluid）包裹挤压，细胞被迫排成单列逐个通过激光焦点。这是流式能"一个细胞一个读数"的物理前提。' },

{ en: 'FSC / SSC', cn: '前向散射 / 侧向散射', group: 'flow',
  match: ['FSC', 'SSC'],
  def: 'FSC 是小角度前向散射，主要反映细胞截面大小；SSC 是 90° 侧向散射，反映内部折射率不连续（细胞器、颗粒度）。第一个门通常画在 FSC/SSC 图上圈出完整细胞——蛋白酶挑战之后碎片会变多，这个门在这里比平时更重要。' },

{ en: 'Gate', cn: '门', group: 'flow',
  match: ['gating', '分选门', '设门'],
  def: '在散点图上圈出的区域，定义"哪些事件算数"。门是按顺序套用的，每一层为下一层清理群体。你的顺序是：完整细胞 → 去黏连 → HA 下限 → c-Myc/HA 对角门。' },

{ en: 'Doublet exclusion', cn: '去黏连', group: 'flow',
  match: ['doublet', '黏连'],
  def: '两个粘在一起的细胞会被当成一个事件，荧光是两者之和，分选时还会一起进管。用 FSC-A 对 FSC-H 排除：单细胞落在对角线上，双联体的信号面积相对峰高偏大，落在对角线上方。' },

{ en: 'Drop delay', cn: '液滴延迟', group: 'flow',
  match: ['drop delay', '液滴延迟'],
  def: '从激光询问点到那段液流断成液滴之间的固定时间差（通常十几个液滴）。仪器必须知道它才能在正确时刻给正确的液滴充电。校准偏一个液滴，你分选的就是前一个或后一个细胞，纯度直接崩。' },

{ en: 'Compensation', cn: '荧光补偿', group: 'flow',
  match: ['compensation', '补偿', '串色'],
  def: '荧光发射谱很宽、有长尾，会漏进相邻通道。用单染对照测出漏出比例再从每个通道扣掉。**在比值读数里尤其关键**：HA 通道漏进 c-Myc 通道的话，HA 越强的细胞比值被虚高得越多——那是系统性偏倚，正好抵消掉你精心设计的归一化。' },

{ en: 'Spectral unmixing', cn: '光谱解混', group: 'flow',
  match: ['spectral unmixing', '光谱解混', '光谱流式'],
  def: '光谱流式测的是完整的发射谱，然后用整条谱做数学解混，而不是用几个检测器做减法。多色高维实验优势明显；两色实验用传统补偿完全够。' },

{ en: 'MFI', cn: '平均荧光强度', group: 'flow',
  // 同上：讲富集和滴定曲线时会引用到，主内容里没直接出现
  only: 'glossary',
  match: ['MFI'],
  def: 'Mean/median fluorescence intensity。一个群体荧光强度的中心值。画滴定曲线（MFI 对配体浓度）拟合出表观 Kd，用的就是它。看群体位移比看"门内百分比"更诚实——百分比只是分布的一个粗糙投影。' },

{ en: 'Enrichment factor', cn: '富集倍数', group: 'flow',
  match: ['enrichment factor', '富集倍数'],
  def: '分选后的阳性率除以分选前的阳性率，必须用同样的门和同样的染色条件测。但真正该看的是**整个分布有没有右移**——门设在分布尾部时，分布轻微移动会造成门内比例的巨大变化。' },

{ en: 'Purity vs yield', cn: '纯度与产率的权衡', group: 'flow',
  match: ['coincidence', 'abort'],
  def: '两个细胞恰好落在同一个液滴里时，仪器要么放弃（abort，保纯度、丢产率），要么照收（保产率、脏）。这就是分选模式的取舍。第一轮通常宁可宽一点保住多样性，后面几轮再收紧。' },

{ en: 'PBSF', cn: 'PBS + BSA 染色缓冲', group: 'flow',
  match: ['PBSF'],
  def: 'PBS 加牛血清白蛋白。BSA 封闭非特异吸附，降低背景。全程冰上操作，既减少抗体解离也减少细胞内化。' },

{ en: 'Cross-laser pairing', cn: '跨激光配色', group: 'flow',
  match: ['AF488', 'AF647', 'CF640R', 'CF488', 'FITC'],
  def: 'AF488/FITC 由 488 nm 激光激发（发射 ~519 nm，绿），AF647/CF640R 由 640 nm 激发（发射 ~668 nm，红）。选跨激光的一对而不是同一激光激发的两个染料，串色会小得多——这是多色流式的基本功。' },

{ en: 'Secondary antibody', cn: '二抗', group: 'flow',
  match: ['secondary antibody', '二抗', '一抗'],
  def: '识别一抗（primary）的抗体，带荧光标记，起放大作用。关键约束：两个一抗必须来自**不同物种**，才能用种属特异的二抗分开检测；同物种的话二抗会同时认两个，通道就废了。' },

/* ═══════════════════════ 测序与分析 ═══════════════════════ */
{ en: 'Sanger sequencing', cn: 'Sanger 测序', group: 'seq',
  match: ['Sanger'],
  def: '双脱氧链终止法 + 毛细管电泳。读长长（500–1000 bp）但一次一条。适合单克隆验证：你要的是一条明确无误的全长读数。峰图上出现套峰说明模板不纯（多克隆混在一起）。' },

{ en: 'NGS / deep sequencing', cn: '高通量测序 · 深度测序', group: 'seq',
  match: ['NGS', 'deep sequencing', '深度测序'],
  def: '边合成边测序、大规模并行，读长短（Illumina 150–300 bp）但一次几百万条。它解决的是**计数**问题：每条序列在每一轮出现多少次。你 15 bp 的随机化区正好适合短读长。' },

{ en: 'Sequencing depth', cn: '测序深度', group: 'seq',
  match: ['depth', '测序深度'],
  def: '平均每个模板被读到多少次。要可靠估计频率，关注的变体至少要几十条 reads。round 0 是所有富集比的**分母**，深度不够会让低频变体的比值噪声极大、虚高，所以它该给最高深度。' },

{ en: 'Enrichment ratio', cn: '富集比', group: 'seq',
  match: ['enrichment ratio', '富集比'],
  def: '某条序列在第 N 轮的频率除以它在 round 0 的频率，通常取 log₂。必须是"实测比实测"——不能拿理论期望当分母，因为建库本身就不均匀（寡核苷酸合成有位置偏倚、转化是随机抽样）。' },

{ en: 'Round 0 / naive library', cn: '未筛文库 · 基线', group: 'seq',
  match: ['round zero', 'round 0', '未筛文库'],
  def: '诱导后、pre-sort 之后、但还没经过任何蛋白酶挑战的文库。它是"富集"这个词的分母，扣掉的是**建库偏倚**。没有它，"某条序列变多了"这句话没有意义。' },

{ en: 'Mock-treated arm', cn: '空白处理臂', group: 'seq',
  match: ['mock-treated', 'mock'],
  def: '走完全部步骤（诱导、染色、按同样的门分选、重新培养）但**不加蛋白酶**的平行实验。它扣掉的是生长和操作偏倚。判据很干净：真抗性变体应该在处理组富集、在 mock 组不富集；两边都富集的是生长优势。' },

{ en: 'PCR bias', cn: 'PCR 偏倚', group: 'seq',
  match: ['PCR bias', 'PCR 偏倚'],
  def: '扩增测序文库时，GC 含量或二级结构不同的模板被差异扩增，把真实频率扭曲。对策：循环数尽量少（一般 ≤20），并做 technical replicate（同一份 DNA 独立扩增两次）来估计这层噪声有多大。' },

{ en: 'Technical replicate', cn: '技术重复', group: 'seq',
  match: ['technical replicate', '技术重复', '独立重复'],
  def: '同一份样品独立走两遍流程。它控制的是**未知**的偏倚——前面所有对照只能控制你想到的那些。两次独立选择如果富集出重叠的序列集合，那不管有什么你没想到的问题，结果至少是可重复的。这是最强的证据。' },

{ en: 'Sequence logo', cn: '序列标识图', group: 'seq',
  match: ['sequence logo', '序列标识', '频率矩阵'],
  def: '把一组序列按位置画成字母高度图，高度代表该残基在这个位置的富集程度。找 motif 用的：单个赢家是轶事，几十条独立富集的序列共享的特征才是结果。' },

{ en: 'Deep mutational scanning', cn: '深度突变扫描', group: 'seq',
  match: ['deep mutational scanning', '深度突变扫描'],
  def: '把某个区域的所有单点突变都做出来、一起施加选择、用深度测序读出每个突变的适应度。你的 linker 文库是它的近亲——只是随机化了少数几个位点、而不是穷举单点。' },

{ en: 'SimPlot', cn: 'SimPlot 重组分析', group: 'seq',
  match: ['SimPlot'],
  def: '滑动窗口相似性分析：沿着一条重组序列取窗口，算它与每个亲本的相似度，画成曲线。哪条曲线在某段最高，说明那段来自哪个亲本；曲线交叉处就是重组断点。你自己的 RBD 课题用它定位断点。' },

/* ═══════════════════════ 非天然氨基酸 ═══════════════════════ */
{ en: 'Non-canonical amino acid (ncAA)', cn: '非天然氨基酸', group: 'ncaa',
  match: ['non-canonical amino acid', 'ncAA', '非天然氨基酸'],
  def: '20 种标准氨基酸之外的、被人工引入蛋白质的残基。引入方式是把某个密码子（通常是 amber）重编码，配一对正交的 aaRS/tRNA，再把这个氨基酸加进培养基。' },

{ en: 'Amber suppression', cn: '琥珀密码子抑制', group: 'ncaa',
  match: ['amber suppression', '琥珀密码子抑制', '抑制效率'],
  def: '让 TAG 不再终止翻译，而是插入你要的非天然氨基酸。本质是一场**竞争**：抑制型 tRNA 和释放因子抢同一个密码子。tRNA 赢了就继续翻译，释放因子赢了就截断。所以效率永远不是 100%，而且细胞之间还有差异。' },

{ en: 'Orthogonal pair', cn: '正交对', group: 'ncaa',
  match: ['orthogonal pair', 'orthogonal', '正交对', '正交'],
  def: 'aaRS + tRNA 的组合，要双向不与宿主翻译机器交叉：宿主的 aaRS 不给这个 tRNA 上载，这个 aaRS 也不给宿主的 tRNA 上载。★ **正交性是相对宿主定义的**——细菌宿主用古菌来源，真核宿主用细菌来源。换宿主就得换对。' },

{ en: 'aaRS', cn: '氨酰-tRNA 合成酶', group: 'ncaa',
  match: ['aaRS', 'synthetase', 'TyrRS'],
  def: 'Aminoacyl-tRNA synthetase，负责把正确的氨基酸装到对应的 tRNA 上。它靠识别 tRNA 上的 identity elements 来配对，而这些元件在进化上保守——所以近缘生物的 aaRS 会交叉识别，这正是要选进化距离远的来源的原因。' },

{ en: 'RF1 / eRF1', cn: '释放因子', group: 'ncaa',
  match: ['RF1', 'eRF1', '释放因子'],
  def: '识别终止密码子、让核糖体释放肽链的蛋白。大肠杆菌的 RF1 只认 UAG 和 UAA，可以敲掉来大幅提高 amber 抑制效率；真核的 eRF1 认全部三个终止密码子，而且是必需基因，不能敲——所以真核里的抑制效率通常更低。' },

{ en: 'pBpa', cn: '对苯甲酰基苯丙氨酸', group: 'ncaa',
  match: ['pBpa', 'p-benzoyl'],
  def: '侧链是二苯甲酮的非天然氨基酸。365 nm 紫外激发后羰基进入三线态双自由基，夺取邻近约 3 Å 内的 C–H 氢原子，两个自由基复合形成共价 C–C 键。用来把接触到的分子钉在一起。' },

{ en: 'Benzophenone photochemistry', cn: '二苯甲酮光化学', group: 'ncaa',
  match: ['benzophenone', 'triplet', '三线态'],

/* ══════════ app.js ══════════ */
/* =========================================================================
   PESB 口试 — app.js
   五个模式：演练 / 题库 / 原文 / 联动 / 速记
   状态（自评）存在 localStorage，key 前缀 pesboral。
   ========================================================================= */
(function () {
'use strict';

const D = window.ORAL;
const QS = D.questions;
const BY_ID = Object.fromEntries(QS.map(q => [q.id, q]));
const GROUP = Object.fromEntries(D.groups.map(g => [g.id, g]));

const LEVELS = [
  { id: 'core',   label: 'core',   cn: '必被问' },
  { id: 'deep',   label: 'deep',   cn: '深追问' },
  { id: 'killer', label: 'killer', cn: '阴招 / 硬伤' }
];

/* ─────────────────────────── 状态 ─────────────────────────── */
const KEY = 'pesboral.v1';
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(defaults(), JSON.parse(raw));
  } catch (e) { /* localStorage 不可用时静默退回默认值，不影响使用 */ }
  return defaults();
}
function defaults() {
  return {
    grades: {},                                   // id -> 'good' | 'half' | 'bad'
    seen: {},                                     // id -> 次数
    groups: D.groups.map(g => g.id),
    levels: LEVELS.map(l => l.id),
    weighted: true,
    theme: null,
    voice: {}                                     // 'en'|'zh' -> {uri, rate, pitch}
  };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 无痕模式等 */ }
}

/* ─────────────────────────── 工具 ─────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* 把 cn 字段里的轻量标记渲染成 HTML：**粗体**、| 表格 |、段落。 */
function richCN(text) {
  if (!text) return '';
  const blocks = String(text).split('\n\n');
  return blocks.map(block => {
    const lines = block.split('\n');
    // 连续的以 | 开头的行 → 表格
    if (lines.length >= 2 && lines.every(l => l.trim().startsWith('|'))) {
      const rows = lines.map(l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
      const isSep = r => r.every(c => /^-+$/.test(c.replace(/:/g, '')));
      const head = rows[0];
      const body = rows.slice(1).filter(r => !isSep(r));
      return '<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') +
             '</tr></thead><tbody>' +
             body.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
             '</tbody></table>';
    }
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

/* 送进语音合成前先脱掉标记：** 会被念成 "star star"，★ 和 → 各家读法不一。 */
function plain(s) {
  return String(s || '')
    .replace(/\*\*/g, '')
    .replace(/[★☆]/g, '')
    .replace(/[→←↳]/g, '，')
    .replace(/\s+/g, ' ')
    .trim();
}

function highlight(html, term) {
  if (!term) return html;
  const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return html.replace(/>([^<]+)</g, (m, txt) => '>' + txt.replace(re, '<mark>$1</mark>') + '<');
}

const MARK = { good: '✓', half: '~', bad: '✕' };

/* ═══════════════════ 术语：正文里就地解释 ═══════════════════
   这个 app 里有一百多个"冷启动概念"——用了但从没解释过的词。
   把它们堆在另一个 tab 里没用，读到一半的人不会切过去。所以正文里
   直接标出来，点一下就地弹出解释。

   匹配在 DOM 的**文本节点**上做，不是拿正则去改 HTML 字符串——后者
   迟早会把标签内部也匹配掉。每个容器里同一个词只标第一次出现，
   不然 HA 出现 103 次会变成一片下划线。 */
const TERMS = D.terms || [];
const TERM_BY_KEY = {};
TERMS.forEach((t, i) => {
  t._i = i;
  // only:'glossary' 的词条主内容里本来就没提，不参与正文标注，只在概念表里查
  if (t.only === 'glossary') return;
  (t.match && t.match.length ? t.match : [t.en]).forEach(k => {
    const key = k.toLowerCase();
    if (!TERM_BY_KEY[key]) TERM_BY_KEY[key] = t;
  });
});

// 长的先匹配，"aspartic protease" 才不会被 "protease" 抢走。
const TERM_KEYS = Object.keys(TERM_BY_KEY).sort((a, b) => b.length - a.length);
const HAS_LATIN = /[a-z]/i;
// 拉丁词要词边界；中文没有词边界，直接匹配，所以 terms.js 里不放单字词。
const TERM_RE = TERM_KEYS.length ? new RegExp(
  TERM_KEYS.map(k => {
    const esc_ = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (!HAS_LATIN.test(k[0])) return esc_;
    // 拉丁词收尾允许一个复数 s，否则 "homology arm" 匹配不上 "homology arms"
    return '\\b' + esc_ + (/[a-z]$/i.test(k) ? '(?:s)?\\b' : (/[0-9]$/.test(k) ? '\\b' : ''));
  }).join('|'), 'gi') : null;

// 这些容器里不标：按钮、已经是术语的地方、以及供朗读的整段 script
// （下划线会打断阅读节奏，而那一段的用途就是照着念）。
const NO_ANNOTATE = [
  'button', 'a', '.say-btn', '.say-run',      // 可点的东西，别嵌套
  '.term-en', '.term-def',                    // 概念表自己，会自我匹配
  '.tag', '.chip', '.verdict', '.lab-col-k', '.ans-label', 'code',
  '.script', '.lab-say', '.open-beat-t'       // 照着念的英文段：下划线会打断朗读节奏
].join(', ');

function annotate(root) {
  if (!root || !TERM_RE) return;
  const seen = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || node.nodeValue.length < 2) return NodeFilter.FILTER_REJECT;
      if (node.parentElement.closest(NO_ANNOTATE)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets = [];
  for (let n = walker.nextNode(); n; n = walker.nextNode()) targets.push(n);

  targets.forEach(node => {
    const text = node.nodeValue;
    TERM_RE.lastIndex = 0;
    let m, last = 0, frag = null;
    while ((m = TERM_RE.exec(text))) {
      const t = TERM_BY_KEY[m[0].toLowerCase()];
      if (!t || seen.has(t._i)) continue;
      seen.add(t._i);
      frag = frag || document.createDocumentFragment();
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('span');
      mark.className = 'term-link';
      mark.dataset.term = t._i;
      mark.tabIndex = 0;
      mark.setAttribute('role', 'button');
      mark.title = t.cn;
      mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length;
    }
    if (frag) {
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  });
}

/* 就地弹出的解释卡。定位跟着被点的词，超出视口就翻到上方。 */
function showTermPop(el) {
  const t = TERMS[Number(el.dataset.term)];
  if (!t) return;
  hideTermPop();
  const g = (D.termGroups || []).find(x => x.id === t.group);
  const pop = document.createElement('div');
  pop.className = 'term-pop';
  pop.innerHTML =
    `<div class="tp-head">
       <span class="tp-en">${esc(t.en)}</span>
       <span class="tp-cn">${esc(t.cn)}</span>
       ${g ? `<span class="tp-group">${g.icon} ${esc(g.name)}</span>` : ''}
       <button class="icon-btn tp-x" aria-label="关闭">✕</button>
     </div>
     <p class="tp-def">${inline(t.def)}</p>
     <div class="tp-foot">
       ${say(plain(t.def), 'zh-CN', '念释义')}
       <button class="btn-ghost btn-tiny tp-all">概念表里看 →</button>
     </div>`;
  document.body.appendChild(pop);

  const r = el.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - pw - 10));
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 10) top = Math.max(10, r.top - ph - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.classList.add('open');

  pop.querySelector('.tp-x').addEventListener('click', hideTermPop);
  pop.querySelector('.tp-all').addEventListener('click', () => {
    hideTermPop();
    setMode('quick');
    showQuickPane('terms');
    $('#term-search').value = t.en;
    renderTermList();
    const card = $('#terms-list').querySelector('.term');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}
function hideTermPop() {
  const p = document.querySelector('.term-pop');
  if (p) p.remove();
}

/* ═══════════════════════════ 朗读 ═══════════════════════════
   Web Speech API 的合成音，不是真人录音。这个 app 里最值得听的是
   script——考官面前你要说出口的那一段。听它以正常语速念一遍，你才
   知道它有多长、断在哪里；默读永远算不出这个。 */
const speechOK = typeof window !== 'undefined' && 'speechSynthesis' in window;
let activeSay = null;

// 语速按语言分开存：同一个数字在中英文里读起来快慢不一样。
const VOICE_DEFAULTS = {
  en: { uri: '', rate: 0.94, pitch: 1 },
  zh: { uri: '', rate: 1.0,  pitch: 1 }
};
// 判断神经网络语音的厂商关键词。Web Speech API 没有 "是否神经网络" 这个
// 字段，名字是唯一的信号，所以这是启发式，面板里也照实说成提示。
const NATURAL_RE = /natural|neural|online|premium|enhanced|siri/i;
const VOICE_SAMPLE = {
  en: 'I would randomise four to five positions with NNK, and sort on the c-Myc to HA ratio.',
  zh: '正交性是相对宿主定义的，换宿主就要换对。这是全篇最可能被抓住的一处。'
};

const langTag = s => String(s || '').replace(/_/g, '-').toLowerCase();
const voiceKey = lang => (langTag(lang).indexOf('zh') === 0 ? 'zh' : 'en');

function voiceCfg(key) { return Object.assign({}, VOICE_DEFAULTS[key], state.voice[key] || {}); }
function setVoiceCfg(key, patch) { state.voice[key] = Object.assign(voiceCfg(key), patch); save(); }

function allVoices() {
  if (!speechOK) return [];
  try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
}
function voicesFor(key) { return allVoices().filter(v => langTag(v.lang).indexOf(key) === 0); }

function pickVoice(lang) {
  const voices = allVoices();
  if (!voices.length) return null;
  const key = voiceKey(lang), cfg = voiceCfg(key);
  if (cfg.uri) {
    const chosen = voices.find(v => v.voiceURI === cfg.uri);
    if (chosen) return chosen;
    // 存的语音没了（换了机器、换了浏览器、系统语音被卸载）。退回自动挑选，
    // 而不是用英文嗓子念中文。
  }
  const want = langTag(lang);
  return voices.find(v => langTag(v.lang) === want) ||
         voices.find(v => langTag(v.lang).indexOf(key) === 0) || null;
}

/* Chrome 会把过长的单条 utterance 念到一半就掐掉，但排队的短句能念完，
   所以长文本一律先按句子切开再排队。 */
function speak(text, lang, btn) {
  if (!speechOK || !text) return;
  // 再点一次正在朗读的按钮 = 停止。cancel() 在有些浏览器不会可靠触发
  // onend，所以视觉状态在这里显式清掉，不指望那个事件。
  if (btn && btn === activeSay) { stopSpeech(); return; }
  stopSpeech();

  const chunks = (String(text).match(/[^.!?。！？；;]+[.!?。！？；;]*/g) || [String(text)])
    .map(c => c.trim()).filter(Boolean);
  if (!chunks.length) return;

  const clear = () => {
    if (btn) btn.classList.remove('speaking');
    if (activeSay === btn) activeSay = null;
  };
  const cfg = voiceCfg(voiceKey(lang));
  chunks.forEach((chunk, i) => {
    const u = new SpeechSynthesisUtterance(chunk);
    const v = pickVoice(lang);
    // 相邻变体的语音（用 zh-TW 的嗓子念 zh-CN）只有跟着自己的 tag 才正常，
    // 所以 utterance 跟随语音，而不是跟随请求。
    u.lang = v && v.lang ? v.lang : lang;
    u.rate = cfg.rate; u.pitch = cfg.pitch;
    if (v) u.voice = v;
    if (i === 0) u.onstart = () => { if (btn) { btn.classList.add('speaking'); activeSay = btn; } };
    if (i === chunks.length - 1) { u.onend = clear; u.onerror = clear; }
    window.speechSynthesis.speak(u);
  });
}

function stopSpeech() {
  if (!speechOK) return;
  window.speechSynthesis.cancel();
  if (activeSay) { activeSay.classList.remove('speaking'); activeSay = null; }
}

/* 小圆 🔊。lang 传 'en-US' 或 'zh-CN'。 */
function say(text, lang, title) {
  if (!speechOK || !text) return '';
  return `<button type="button" class="say-btn" data-say="${esc(text)}" data-lang="${lang || 'en-US'}"
            aria-label="朗读" title="${esc(title || '朗读（系统合成音，不是真人录音）')}">🔊</button>`;
}
/* 带文字的成组朗读按钮：整段开场白、整串 beats。 */
function sayRun(text, lang, label) {
  if (!speechOK || !text) return '';
  return `<button type="button" class="say-run" data-say="${esc(text)}" data-lang="${lang || 'en-US'}"
            title="连着念完（系统合成音）">🔊 ${esc(label)}</button>`;
}

/* 事件用 capture 阶段委托到 document：面板会整块重渲染，逐次绑定容易漏。
   preventDefault 同时挡掉 <summary> 的默认展开——题库里的 🔊 就在 summary
   里面，不挡的话点朗读会顺手把卡片折叠掉。 */
function wireSay() {
  document.addEventListener('click', e => {
    const btn = e.target.closest('.say-btn, .say-run');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    speak(btn.dataset.say, btn.dataset.lang, btn);
  }, true);
}

/* 术语点击也走 capture：术语可能出现在 <summary> 里，
   不挡住默认行为的话点解释会把整张卡折叠掉。 */
function wireTerms() {
  document.addEventListener('click', e => {
    const link = e.target.closest('.term-link');
    if (link) {
      e.preventDefault(); e.stopPropagation();
      showTermPop(link);
      return;
    }
    if (!e.target.closest('.term-pop')) hideTermPop();
  }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideTermPop();
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement
        && document.activeElement.classList.contains('term-link')) {
      e.preventDefault();
      showTermPop(document.activeElement);
    }
  });
  // 弹卡是绝对定位的，页面一滚就对不上了，直接收掉
  window.addEventListener('scroll', hideTermPop, true);
  window.addEventListener('resize', hideTermPop);
}

/* ─────────────────────── 朗读设置面板 ─────────────────────── */
let padKey = 'en';
const padIsOpen = () => { const p = $('#voice-pad'); return p && !p.hidden; };

function renderPad() {
  const pad = $('#voice-pad');
  if (!pad) return;
  if (!speechOK) {
    pad.innerHTML = '<p class="vp-note">这个浏览器不支持语音合成。用 Chrome、Edge 或 Safari 打开本页。</p>';
    return;
  }
  const key = padKey, cfg = voiceCfg(key);
  const list = voicesFor(key);
  const natural = list.filter(v => NATURAL_RE.test(v.name));

  const opts = ['<option value=""' + (cfg.uri ? '' : ' selected') + '>自动选择 · Automatic</option>']
    .concat(list.map(v =>
      '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === cfg.uri ? ' selected' : '') + '>'
      + esc(v.name) + ' · ' + esc(v.lang) + (NATURAL_RE.test(v.name) ? ' ✦自然' : '') + '</option>'
    )).join('');

  // 说清楚缺的是什么，比给一个空下拉框有用：干净的 Windows 上根本没有中文
  // 语音，页面上不写的话，你只会听到一片安静而不知道为什么。
  let hint = '';
  if (!list.length) {
    hint = '<p class="vp-warn">这台电脑没有装' + (key === 'zh' ? '中文' : '英文') + '语音。'
         + 'Windows：设置 → 时间和语言 → 语音 → 添加语音；或者直接用 Microsoft Edge 打开本页。</p>';
  } else if (!natural.length) {
    hint = '<p class="vp-note">只找到合成感较强的系统语音。用 Microsoft Edge 打开本页能拿到 '
         + '“Online (Natural)” 神经网络语音，最接近真人——练口试时这个差别很大。</p>';
  }

  pad.innerHTML =
    '<div class="vp-head"><strong>朗读 · Read aloud</strong>'
    + '<button type="button" class="icon-btn vp-x" id="vp-close" aria-label="关闭">✕</button></div>'
    + '<div class="vp-tabs">'
    + '<button type="button" data-vp="en" class="' + (key === 'en' ? 'active' : '') + '">EN · script</button>'
    + '<button type="button" data-vp="zh" class="' + (key === 'zh' ? 'active' : '') + '">中文 · 要点</button>'
    + '</div>'
    + '<label class="vp-row"><span>声音</span><select id="vp-voice">' + opts + '</select></label>'
    + hint
    + '<label class="vp-row"><span>语速</span>'
    + '<input type="range" id="vp-rate" min="0.5" max="1.6" step="0.02" value="' + cfg.rate + '">'
    + '<output id="vp-rate-val">' + cfg.rate.toFixed(2) + '×</output></label>'
    + '<label class="vp-row"><span>音调</span>'
    + '<input type="range" id="vp-pitch" min="0.6" max="1.4" step="0.05" value="' + cfg.pitch + '">'
    + '<output id="vp-pitch-val">' + cfg.pitch.toFixed(2) + '</output></label>'
    + '<div class="vp-actions">'
    + '<button type="button" class="btn-ghost vp-btn" id="vp-test">▶ 试听</button>'
    + '<button type="button" class="btn-ghost vp-btn" id="vp-stop">■ 停止</button>'
    + '<button type="button" class="btn-ghost vp-btn" id="vp-reset">复位</button>'
    + '</div>'
    + '<p class="vp-note">系统合成音，不是真人录音。标 ✦自然 的是神经网络语音；'
    + '判断依据只是语音名称，仅作提示。设置对全站每一个 🔊 生效。</p>';
}

function padSetOpen(open) {
  const pad = $('#voice-pad');
  if (!pad) return;
  if (open) renderPad();
  pad.hidden = !open;
  const btn = $('#voice-toggle');
  if (btn) { btn.classList.toggle('active', open); btn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
}

function wirePad() {
  const pad = $('#voice-pad'), toggle = $('#voice-toggle');
  if (!pad || !toggle) return;

  toggle.addEventListener('click', e => { e.stopPropagation(); padSetOpen(pad.hidden); });

  // 拖滑块时不能整块重渲染——那会把滑块从指针底下抽走。每个控件只更新自己
  // 的读数和存的值。
  pad.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'vp-voice') { setVoiceCfg(padKey, { uri: t.value }); return; }
    if (t.id === 'vp-rate') {
      const r = Number(t.value); setVoiceCfg(padKey, { rate: r });
      $('#vp-rate-val').textContent = r.toFixed(2) + '×'; return;
    }
    if (t.id === 'vp-pitch') {
      const p = Number(t.value); setVoiceCfg(padKey, { pitch: p });
      $('#vp-pitch-val').textContent = p.toFixed(2);
    }
  });

  pad.addEventListener('click', e => {
    e.stopPropagation();
    const tab = e.target.closest('[data-vp]');
    if (tab) { padKey = tab.dataset.vp; renderPad(); return; }
    if (e.target.closest('#vp-close')) { padSetOpen(false); return; }
    if (e.target.closest('#vp-reset')) { delete state.voice[padKey]; save(); renderPad(); return; }
    if (e.target.closest('#vp-stop')) { stopSpeech(); return; }
    const test = e.target.closest('#vp-test');
    if (test) speak(VOICE_SAMPLE[padKey], padKey === 'zh' ? 'zh-CN' : 'en-US', test);
  });

  document.addEventListener('click', () => { if (padIsOpen()) padSetOpen(false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && padIsOpen()) padSetOpen(false);
  });
  // 有些浏览器要等 voiceschanged 才拿得到语音列表，那时面板可能已经开着了。
  if (speechOK && typeof window.speechSynthesis.addEventListener === 'function') {
    window.speechSynthesis.addEventListener('voiceschanged', () => { if (padIsOpen()) renderPad(); });
  }
}

/* ─────────────────────── 题目卡片渲染 ─────────────────────── */
/* full=true 显示答案区；用于演练翻面后和题库展开。 */
function renderAnswer(q) {
  let h = '';

  h += `<div class="ans-block"><div class="ans-label">说话顺序 · beats
          ${sayRun(plain(q.beats.join('。')), 'zh-CN', '念要点')}</div>
        <ol class="beats">${q.beats.map(b => `<li>${inline(b)}</li>`).join('')}</ol></div>`;

  // script 是这个 app 里最值得听的东西——考官面前你要说出口的那一段。
  h += `<div class="ans-block"><div class="ans-label">可以直接说出口的 · script
          ${sayRun(q.script, 'en-US', '念一遍')}</div>
        <div class="script">${esc(q.script)}</div></div>`;

  h += `<div class="ans-block"><div class="ans-label">为什么是这个答案</div>
        <div class="cn-explain">${richCN(q.cn)}</div></div>`;

  if (q.followups && q.followups.length) {
    h += `<div class="ans-block"><div class="ans-label">考官会接着挖 · follow-ups</div>` +
         q.followups.map(f =>
           `<div class="fu">
              <p class="fu-q">${esc(f.q)}${say(f.q, 'en-US', '念这个追问')}</p>
              <p class="fu-a">${inline(f.a)}${say(plain(f.a), 'zh-CN', '念答案')}</p>
            </div>`
         ).join('') + `</div>`;
  }

  if (q.trap) {
    h += `<div class="callout callout-trap"><span class="callout-label">踩雷点</span>${inline(q.trap)}</div>`;
  }
  if (q.lab) {
    h += `<div class="callout callout-lab"><span class="callout-label">联动你做过的实验</span>${inline(q.lab)}</div>`;
  }
  return h;
}

function qTags(q) {
  const g = GROUP[q.group];
  return `<div class="qcard-tags">
    <span class="tag tag-${q.level}">${q.level}</span>
    <span class="tag tag-group">${g.icon} ${g.cn}</span>
    <span class="tag tag-id">${q.id}</span>
  </div>`;
}

/* ═══════════════════════════ 模式：演练 ═══════════════════════════ */
let drill = { queue: [], i: 0, revealed: false };

function buildChips() {
  $('#drill-groups').innerHTML = D.groups.map(g => {
    const n = QS.filter(q => q.group === g.id).length;
    const on = state.groups.includes(g.id) ? ' active' : '';
    return `<button class="chip${on}" data-g="${g.id}">${g.icon} ${g.cn}<span class="chip-n">${n}</span></button>`;
  }).join('');

  $('#drill-levels').innerHTML = LEVELS.map(l => {
    const n = QS.filter(q => q.level === l.id).length;
    const on = state.levels.includes(l.id) ? ' active' : '';
    return `<button class="chip${on}" data-l="${l.id}">${l.label} <span class="chip-note">${l.cn}</span><span class="chip-n">${n}</span></button>`;
  }).join('');

  $('#drill-weighted').classList.toggle('active', state.weighted);
  updateDrillCount();
}

function pool() {
  return QS.filter(q => state.groups.includes(q.group) && state.levels.includes(q.level));
}

function updateDrillCount() {
  const p = pool();
  const un = p.filter(q => !state.grades[q.id]).length;
  $('#drill-count').textContent = `范围内 ${p.length} 题，其中 ${un} 题还没练过。`;
  $('#drill-start').disabled = p.length === 0;
}

/* 加权抽题：不会的权重最高，没练过次之，答得出的最低。 */
function shuffleWeighted(items) {
  const w = q => {
    if (!state.weighted) return 1;
    const g = state.grades[q.id];
    if (g === 'bad')  return 8;
    if (g === 'half') return 4;
    if (g === 'good') return 1;
    return 6;                       // 没练过
  };
  // 加权洗牌：每项取 random^(1/w)，降序。权重大的更可能排前面。
  return items
    .map(q => ({ q, k: Math.pow(Math.random(), 1 / w(q)) }))
    .sort((a, b) => b.k - a.k)
    .map(x => x.q);
}

function startDrill() {
  const p = pool();
  if (!p.length) return;
  drill.queue = shuffleWeighted(p);
  drill.i = 0;
  $('#drill-setup').hidden = true;
  $('#drill-stage').hidden = false;
  showDrill();
}

function showDrill() {
  stopSpeech();                 // 上一题的 script 不能压着下一题念
  if (drill.i >= drill.queue.length) {
    $('#drill-card').innerHTML =
      `<div class="qcard"><div class="qcard-body"><p class="empty">
        这一轮 ${drill.queue.length} 题都过完了。回设置换个范围，或者再抽一轮。
      </p></div></div>`;
    $('#drill-pos').textContent = `${drill.queue.length} / ${drill.queue.length}`;
    return;
  }
  drill.revealed = false;
  const q = drill.queue[drill.i];
  $('#drill-pos').textContent = `${drill.i + 1} / ${drill.queue.length}`;

  $('#drill-card').innerHTML = `
    <div class="qcard">
      <div class="qcard-head">
        ${qTags(q)}
        <p class="qcard-q">${esc(q.q)}${say(q.q, 'en-US', '让考官念给你听')}</p>
        <p class="qcard-qcn">${esc(q.qcn)}${say(q.qcn, 'zh-CN', '念中文')}</p>
      </div>
      <div class="qcard-prompt">
        <span>先自己开口说完整段，再翻。</span>
        <button class="btn-primary" id="reveal">翻答案</button>
      </div>
      <div class="qcard-body" id="drill-answer" hidden></div>
    </div>`;

  $('#reveal').addEventListener('click', reveal);
}

function reveal() {
  if (drill.revealed) return;
  drill.revealed = true;
  const q = drill.queue[drill.i];
  state.seen[q.id] = (state.seen[q.id] || 0) + 1;
  save();

  const body = $('#drill-answer');
  body.hidden = false;
  body.innerHTML = renderAnswer(q) + `
    <div class="grade-row">
      <button class="grade-btn grade-good" data-grade="good">✓ 答得出<small>说得完整</small></button>
      <button class="grade-btn grade-half" data-grade="half">~ 半会<small>方向对，漏了要点</small></button>
      <button class="grade-btn grade-bad"  data-grade="bad">✕ 不会<small>说不出来</small></button>
    </div>`;

  $('.qcard-prompt').innerHTML = '<span>自评之后自动下一题。</span>';
  annotate(body);

  body.querySelectorAll('[data-grade]').forEach(b => {
    b.addEventListener('click', () => {
      state.grades[q.id] = b.dataset.grade;
      save();
      updateStat();
      drill.i++;
      showDrill();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/* ═══════════════════════════ 模式：题库 ═══════════════════════════ */
let bankExpanded = false;

function initBank() {
  $('#bank-total').textContent = QS.length + ' 题';
  $('#bank-group').innerHTML = '<option value="">全部板块</option>' +
    D.groups.map(g => `<option value="${g.id}">${g.icon} ${g.cn}</option>`).join('');
  ['#bank-search', '#bank-group', '#bank-level', '#bank-status'].forEach(s =>
    $(s).addEventListener('input', renderBank));
  $('#bank-expand').addEventListener('click', () => {
    bankExpanded = !bankExpanded;
    $('#bank-expand').textContent = bankExpanded ? '全部折叠' : '全部展开';
    renderBank();
  });
  renderBank();
}

function renderBank() {
  const term = $('#bank-search').value.trim().toLowerCase();
  const g = $('#bank-group').value;
  const lv = $('#bank-level').value;
  const st = $('#bank-status').value;

  let list = QS.filter(q => {
    if (g && q.group !== g) return false;
    if (lv && q.level !== lv) return false;
    if (st) {
      const cur = state.grades[q.id] || 'none';
      if (cur !== st) return false;
    }
    if (term) {
      const hay = [q.q, q.qcn, q.beats.join(' '), q.script, q.cn, q.trap || '', q.lab || '',
                   (q.followups || []).map(f => f.q + f.a).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  $('#bank-count').textContent = `${list.length} 题` + (term ? `，匹配 "${term}"` : '');

  if (!list.length) { $('#bank-body').innerHTML = '<p class="empty">没有匹配的题。</p>'; return; }

  let html = '';
  D.groups.forEach(grp => {
    const sub = list.filter(q => q.group === grp.id);
    if (!sub.length) return;
    html += `<div class="bank-group-head">${grp.icon} ${grp.cn} · ${grp.name} <span style="opacity:.6">(${sub.length})</span></div>`;
    html += sub.map(q => {
      const mk = state.grades[q.id];
      const cls = mk ? 'mark-' + mk : 'mark-none';
      const sym = mk ? MARK[mk] : '·';
      return `<details class="bank-item"${bankExpanded ? ' open' : ''} id="bank-${q.id}">
        <summary>
          <span class="bank-mark ${cls}">${sym}</span>
          <span class="bank-q">${esc(q.q)}${say(q.q, 'en-US', '念这道题')}<span class="bank-qcn">${esc(q.qcn)}</span></span>
          <span class="tag tag-${q.level}">${q.level}</span>
        </summary>
        <div class="bank-body">${renderAnswer(q)}</div>
      </details>`;
    }).join('');
  });

  $('#bank-body').innerHTML = term ? highlight(html, term) : html;
  // 每张卡是一个独立容器，各自标各自的第一次出现
  $$('#bank-body .bank-body').forEach(annotate);
}

/* ═══════════════════════════ 模式：原文 ═══════════════════════════ */
let showRisk = true;

function initPaper() {
  const m = D.paperMeta;
  $('#paper-meta').innerHTML =
    `<span class="pm-title">${esc(m.title)}</span>
     <span class="pm-line">${esc(m.course)} · ${esc(m.author)} · 提交于 ${esc(m.submitted)} · ${esc(m.wordish)}</span>`;

  $('#paper-risk').addEventListener('click', () => {
    showRisk = !showRisk;
    $('#paper-risk').classList.toggle('active', showRisk);
    $('#paper-risk').textContent = showRisk ? '显示风险批注' : '只看原文';
    renderPaper();
  });
  renderPaper();
}

function renderPaper() {
  $('#paper-body').innerHTML = D.paper.map(sec => `
    <section class="paper-sec">
      <h3 class="paper-sec-head">${esc(sec.section)}<span class="cn">${esc(sec.cn)}</span></h3>
      ${sec.paras.map(p => `
        <div class="para">
          ${p.label ? `<p class="para-label">${esc(p.label)}</p>` : ''}
          <p class="para-text">${esc(p.text)}${say(p.text, 'en-US', '念这一段原文')}</p>
          ${p.hooks && p.hooks.length ? `
            <div class="para-hooks">
              <span class="hooks-label">会被问</span>
              ${p.hooks.map(id => {
                const q = BY_ID[id];
                if (!q) return '';
                return `<button class="hook" data-jump="${id}" title="${esc(q.q)}">
                          <span class="hook-id">${id}</span>${esc(q.qcn)}
                        </button>`;
              }).join('')}
            </div>` : ''}
          ${showRisk && p.risk ? `
            <div class="callout callout-risk">
              <span class="callout-label">这一段自己带的风险</span>${inline(p.risk)}
            </div>` : ''}
        </div>`).join('')}
    </section>`).join('');

  // 原文本身逐段标：读到 "Aga2p" 或 "NNK" 当场能点开
  $$('#paper-body .para').forEach(annotate);

  $$('#paper-body [data-jump]').forEach(b =>
    b.addEventListener('click', () => jumpToQuestion(b.dataset.jump)));
}

/* 从原文/死穴跳到题库里的那一题并展开 */
function jumpToQuestion(id) {
  setMode('bank');
  $('#bank-search').value = '';
  $('#bank-group').value = '';
  $('#bank-level').value = '';
  $('#bank-status').value = '';
  bankExpanded = false;
  $('#bank-expand').textContent = '全部展开';
  renderBank();
  const el = $('#bank-' + id);
  if (el) {
    el.open = true;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.transition = 'box-shadow .3s';
    el.style.boxShadow = '0 0 0 3px var(--accent-soft)';
    setTimeout(() => { el.style.boxShadow = ''; }, 1600);
  }
}

/* ═══════════════════════════ 模式：联动 ═══════════════════════════ */
let labFilter = '';

function renderLab() {
  const V = D.verdicts;
  const counts = {};
  D.lab.forEach(l => { counts[l.verdict] = (counts[l.verdict] || 0) + 1; });

  $('#lab-filter').innerHTML =
    `<button class="chip${labFilter ? '' : ' active'}" data-v="">全部<span class="chip-n">${D.lab.length}</span></button>` +
    Object.keys(V).filter(k => counts[k]).map(k =>
      `<button class="chip${labFilter === k ? ' active' : ''}" data-v="${k}">${esc(V[k].label)}<span class="chip-n">${counts[k]}</span></button>`
    ).join('');

  const list = labFilter ? D.lab.filter(l => l.verdict === labFilter) : D.lab;

  $('#lab-body').innerHTML = list.map(l => {
    const v = V[l.verdict];
    return `
    <div class="lab-item lab-${v.tone}">
      <div class="lab-head">
        <h3 class="lab-step">${esc(l.topic)}</h3>
        <span class="verdict verdict-${v.tone}">${esc(v.label)}</span>
        <span class="verdict-hint">${esc(v.cn)}</span>
      </div>
      <div class="lab-cols">
        <div class="lab-col lab-mine">
          <div class="lab-col-k">你做过的</div>
          <div class="lab-col-v">${inline(l.mine)}</div>
        </div>
        <div class="lab-col lab-theirs">
          <div class="lab-col-k">作业提的</div>
          <div class="lab-col-v">${inline(l.theirs)}</div>
        </div>
      </div>
      <div class="lab-why">
        <span class="callout-label">差别在哪 · 为什么</span>${inline(l.why)}
      </div>
      <div class="lab-say">${esc(l.say)}${say(l.say, 'en-US', '念这句')}</div>
      <p class="lab-tech">${esc(l.tech)}</p>
    </div>`;
  }).join('');

  annotate($('#lab-body'));

  $('#lab-filter').querySelectorAll('[data-v]').forEach(b =>
    b.addEventListener('click', () => { labFilter = b.dataset.v; renderLab(); }));
}

/* ═══════════════════════════ 模式：速记 ═══════════════════════════ */
function renderQuick() {
  /* 开场白 */
  const o = D.opening;
  // 开场白是唯一一段你该逐字背下来的东西，所以这里给一个整段连读——
  // 听一遍就知道 60 秒到底装不装得下。
  $('#quick-opening').innerHTML =
    `<h2 style="font-size:20px;margin:0 0 6px">${esc(o.title)}
       ${sayRun(o.en.map(b => b.text).join(' '), 'en-US', '整段连读')}</h2>
     <p class="open-note">${esc(o.note)}</p>` +
    o.en.map(b => `
      <div class="open-beat">
        <div class="open-beat-k">${esc(b.beat)}${say(b.text, 'en-US', '念这一拍')}</div>
        <div class="open-beat-t">${esc(b.text)}</div>
      </div>`).join('') +
    `<div class="callout callout-risk" style="margin-top:22px">
       <span class="callout-label">讲法</span>${richCN(o.cn)}</div>`;

  /* 死穴 */
  $('#quick-weak').innerHTML =
    `<p class="lede" style="margin-bottom:20px">
       按被抓住的代价排序。前三条<strong>必须</strong>练到能平静地接住——
       接得好，一记硬伤会变成你全场最亮的时刻；硬撑则相反。
     </p>` +
    D.weakspots.map(w => `
      <div class="weak-item weak-${w.severity}">
        <div class="weak-head">
          <span class="weak-what">${esc(w.what)}</span>
          <span class="weak-sev sev-${w.severity}">${w.severity}</span>
        </div>
        <div class="weak-where">${esc(w.where)}</div>
        <p class="weak-detail" style="margin-top:10px">${inline(w.detail)}</p>
        <div class="weak-fix"><span class="callout-label" style="color:var(--core)">怎么接</span>${inline(w.fix)}</div>
        ${w.note ? `<p class="weak-note">${inline(w.note)}</p>` : ''}
        ${w.q ? `<div class="weak-jump"><button class="btn-ghost btn-tiny" data-jump="${w.q}">练这一题 → ${w.q}</button></div>` : ''}
      </div>`).join('');

  $$('#quick-weak .weak-item').forEach(annotate);
  $$('#quick-weak [data-jump]').forEach(b =>
    b.addEventListener('click', () => jumpToQuestion(b.dataset.jump)));

  /* 数字 */
  $('#quick-numbers').innerHTML =
    `<p class="lede" style="margin-bottom:18px">这些必须能当场报出来，不能现推。</p>
     <table class="numbers">
       <thead><tr><th>项</th><th>值</th><th>为什么</th></tr></thead>
       <tbody>${D.numbers.map(n =>
         `<tr><td>${esc(n.k)}</td><td class="v">${esc(n.v)}</td><td class="why">${inline(n.why)}</td></tr>`
       ).join('')}</tbody>
     </table>`;

  /* 概念（术语） */
  $('#terms-n').textContent = TERMS.length;
  $('#quick-terms').innerHTML =
    `<p class="lede" style="margin-bottom:16px">
       这 ${TERMS.length} 条是审计出来的<strong>冷启动概念</strong>——app 正文里用了、
       但从来没解释过的词。正文里它们带虚线下划线，点一下就地弹出解释，不用切到这里来。
     </p>
     <div class="term-controls">
       <input type="search" id="term-search" placeholder="搜术语、中文、释义…" autocomplete="off">
       <div class="chip-row" id="term-groups"></div>
     </div>
     <p class="bank-count" id="term-count"></p>
     <div id="terms-list"></div>`;

  $('#term-search').addEventListener('input', renderTermList);
  renderTermGroups();
  renderTermList();

  $$('.qnav').forEach(b => b.addEventListener('click', () => showQuickPane(b.dataset.q)));
}

function showQuickPane(id) {
  $$('.qnav').forEach(x => x.classList.toggle('active', x.dataset.q === id));
  $$('.quick-pane').forEach(x => x.classList.toggle('active', x.id === 'quick-' + id));
}

let termGroup = '';

function renderTermGroups() {
  const counts = {};
  TERMS.forEach(t => { counts[t.group] = (counts[t.group] || 0) + 1; });
  $('#term-groups').innerHTML =
    `<button class="chip${termGroup ? '' : ' active'}" data-tg="">全部<span class="chip-n">${TERMS.length}</span></button>` +
    (D.termGroups || []).map(g =>
      `<button class="chip${termGroup === g.id ? ' active' : ''}" data-tg="${g.id}">${g.icon} ${esc(g.name)}<span class="chip-n">${counts[g.id] || 0}</span></button>`
    ).join('');
  $('#term-groups').querySelectorAll('[data-tg]').forEach(b =>
    b.addEventListener('click', () => { termGroup = b.dataset.tg; renderTermGroups(); renderTermList(); }));
}

function renderTermList() {
  const q = $('#term-search').value.trim().toLowerCase();
  const list = TERMS.filter(t => {
    if (termGroup && t.group !== termGroup) return false;
    if (!q) return true;
    return (t.en + ' ' + t.cn + ' ' + t.def + ' ' + (t.match || []).join(' ')).toLowerCase().includes(q);
  });

  $('#term-count').textContent = `${list.length} 条` + (q ? `，匹配 "${q}"` : '');

  if (!list.length) { $('#terms-list').innerHTML = '<p class="empty">没有匹配的概念。</p>'; return; }

  let html = '';
  (D.termGroups || []).forEach(g => {
    const sub = list.filter(t => t.group === g.id);
    if (!sub.length) return;
    if (!termGroup) html += `<div class="bank-group-head">${g.icon} ${esc(g.name)} <span style="opacity:.6">(${sub.length})</span></div>`;
    html += sub.map(t => `
      <div class="term">
        <div class="term-h">
          <span class="term-en">${esc(t.en)}${say(t.en, 'en-US', '念这个词')}</span>
          <span class="term-cn">${esc(t.cn)}</span>
        </div>
        <p class="term-def">${inline(t.def)}${say(plain(t.def), 'zh-CN', '念释义')}</p>
      </div>`).join('');
  });
  $('#terms-list').innerHTML = q ? highlight(html, q) : html;
}

/* ═══════════════════════════ 外壳 ═══════════════════════════ */
function setMode(mode) {
  stopSpeech();                 // 换面板时别让上一段还在念
  $$('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + mode));
}

function updateStat() {
  const g = Object.values(state.grades);
  const good = g.filter(x => x === 'good').length;
  const half = g.filter(x => x === 'half').length;
  const bad  = g.filter(x => x === 'bad').length;
  $('#stat-line').textContent = `${good}✓ ${half}~ ${bad}✕ / ${QS.length}`;
}

/* 只有你自己按过 ◐ 之后才往根元素上标 data-theme。没标的时候交给
   prefers-color-scheme——发布成 Artifact 之后，外层宿主也是靠标这个属性
   传递主题的，所以初始化时绝不去动它，免得把宿主的选择擦掉。 */
function effectiveTheme() {
  return document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyTheme() {
  if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
}

function init() {
  applyTheme();
  $('#theme-toggle').addEventListener('click', () => {
    state.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
    save(); applyTheme();
  });

  $$('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  /* 演练 setup 交互 */
  buildChips();
  $('#drill-groups').addEventListener('click', e => {
    const c = e.target.closest('[data-g]'); if (!c) return;
    const id = c.dataset.g;
    state.groups = state.groups.includes(id)
      ? state.groups.filter(x => x !== id) : state.groups.concat(id);
    c.classList.toggle('active');
    save(); updateDrillCount();
  });
  $('#drill-levels').addEventListener('click', e => {
    const c = e.target.closest('[data-l]'); if (!c) return;
    const id = c.dataset.l;
    state.levels = state.levels.includes(id)
      ? state.levels.filter(x => x !== id) : state.levels.concat(id);
    c.classList.toggle('active');
    save(); updateDrillCount();
  });
  $$('.chip-all').forEach(b => b.addEventListener('click', () => {
    state.groups = b.dataset.all === 'on' ? D.groups.map(g => g.id) : [];
    save(); buildChips();
  }));
  $('#drill-weighted').addEventListener('click', () => {
    state.weighted = !state.weighted;
    $('#drill-weighted').classList.toggle('active', state.weighted);
    save();
  });
  $('#drill-start').addEventListener('click', startDrill);
  $('#drill-back').addEventListener('click', () => {
    $('#drill-stage').hidden = true;
    $('#drill-setup').hidden = false;
    buildChips();
  });
  $('#drill-skip').addEventListener('click', () => {
    drill.i++; showDrill(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  wireSay();
  wirePad();
  wireTerms();

  /* 空格翻面；Esc 或 S 停朗读 */
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.code === 'Space' && $('#panel-drill').classList.contains('active')
        && !$('#drill-stage').hidden && !drill.revealed) {
      e.preventDefault(); reveal(); return;
    }
    if (e.key === 'Escape' || e.key === 's' || e.key === 'S') stopSpeech();
  });

  initBank();
  initPaper();
  renderLab();
  renderQuick();
  updateStat();
}

document.addEventListener('DOMContentLoaded', init);
})();


/* ══════════ 单文件打包补丁 ══════════ */
/* app.js 挂的是 DOMContentLoaded。宿主如果在文档已经就绪之后才注入这段，
   那个事件永远不会再来，页面会停在一片空白——所以这里补一次直接调用。 */
if (document.readyState !== 'loading') {
  document.dispatchEvent(new Event('DOMContentLoaded'));
}

</script>
</body>
</html>
