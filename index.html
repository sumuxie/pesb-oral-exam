<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>PESB 口试</title>
<style>
/* =========================================================================
   PESB 口试 — 独立 app，不共用任何旧 app 的样式
   浅色为主，深色可切。阅读优先：正文宽度受限，行高偏松。
   ========================================================================= */

:root {
  --bg:        #f7f5f1;
  --bg-panel:  #ffffff;
  --bg-sunk:   #f0ede7;
  --ink:       #1c1b19;
  --ink-soft:  #5a564f;
  --ink-faint: #8b857b;
  --rule:      #e0dbd2;
  --rule-soft: #ebe7e0;

  --accent:      #8b5a2b;      /* 口试棕 */
  --accent-soft: #f3e9dc;
  --core:        #2f6f4f;
  --core-soft:   #e3f0e8;
  --deep:        #2a5d8f;
  --deep-soft:   #e2ecf6;
  --killer:      #a32e2e;
  --killer-soft: #f8e4e2;

  --good: #2f6f4f;
  --half: #b07d1a;
  --bad:  #a32e2e;

  --warn:      #b45309;
  --warn-soft: #fdeed7;

  --radius: 10px;
  --shadow:     0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.045);
  --shadow-pad: 0 14px 38px rgba(0,0,0,.28);

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Source Han Serif SC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --mono: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}

/* 深色 token 要覆盖三种状态，所以下面这一段刻意出现两次：

   1. 跟随系统（根元素上没有任何标记）—— 这是大多数人看到的状态。
      用 :not([data-theme="light"]) 守住，好让"明确选了浅色"能压过深色系统。
   2. 明确要深色（本 app 的 ◐ 按钮，或者外层宿主标上 data-theme="dark"）。

   CSS 没法让一条规则同时活在 @media 里和外面，所以只能重复。
   tools/build_single.py 会断言两份完全一致，写歪了会在打包时报错。
   —— DARK TOKENS START —— */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg:        #16151a;
  --bg-panel:  #1e1d23;
  --bg-sunk:   #26252c;
  --ink:       #e9e6e0;
  --ink-soft:  #b0aaa1;
  --ink-faint: #7d776e;
  --rule:      #34323a;
  --rule-soft: #2a2930;

  --accent:      #d8a066;
  --accent-soft: #3a2e20;
  --core:        #6fbf94;
  --core-soft:   #1f3a2c;
  --deep:        #7cb2e0;
  --deep-soft:   #1e3245;
  --killer:      #e58b84;
  --killer-soft: #3d2320;

  --good: #6fbf94;
  --half: #d8b45c;
  --bad:  #e58b84;

  --warn:      #e0a94f;
  --warn-soft: #3d2f18;

  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-pad: 0 14px 38px rgba(0,0,0,.6);
  }
}

:root[data-theme="dark"] {
  --bg:        #16151a;
  --bg-panel:  #1e1d23;
  --bg-sunk:   #26252c;
  --ink:       #e9e6e0;
  --ink-soft:  #b0aaa1;
  --ink-faint: #7d776e;
  --rule:      #34323a;
  --rule-soft: #2a2930;

  --accent:      #d8a066;
  --accent-soft: #3a2e20;
  --core:        #6fbf94;
  --core-soft:   #1f3a2c;
  --deep:        #7cb2e0;
  --deep-soft:   #1e3245;
  --killer:      #e58b84;
  --killer-soft: #3d2320;

  --good: #6fbf94;
  --half: #d8b45c;
  --bad:  #e58b84;

  --warn:      #e0a94f;
  --warn-soft: #3d2f18;

  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-pad: 0 14px 38px rgba(0,0,0,.6);
}
/* —— DARK TOKENS END —— */

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* ───────────────────────────── topbar ───────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 10px 20px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; flex-direction: column; line-height: 1.25; }
.brand strong { font-size: 16px; letter-spacing: .02em; }
.brand-sub { font-size: 11.5px; color: var(--ink-faint); }

.modes { display: flex; gap: 4px; margin-left: auto; }
.mode-btn {
  font: inherit; font-size: 13.5px;
  padding: 6px 13px; border-radius: 999px;
  border: 1px solid transparent; background: none; color: var(--ink-soft);
  cursor: pointer; transition: background .12s, color .12s;
}
.mode-btn:hover { background: var(--bg-sunk); }
.mode-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.mode-btn span { margin-left: 2px; }

.topbar-right { display: flex; align-items: center; gap: 12px; }
.stat { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); white-space: nowrap; }
.icon-btn {
  font: inherit; font-size: 15px; width: 30px; height: 30px;
  border: 1px solid var(--rule); border-radius: 8px;
  background: var(--bg-panel); color: var(--ink-soft); cursor: pointer;
}
.icon-btn:hover { background: var(--bg-sunk); }

/* ───────────────────────────── layout ───────────────────────────── */
.content { max-width: 1080px; margin: 0 auto; padding: 26px 20px 90px; }
.panel { display: none; }
.panel.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.panel-head {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 18px;
  border-bottom: 1px solid var(--rule);
}
.panel-head h2 { margin: 0; font-size: 19px; font-weight: 650; }
.muted { color: var(--ink-faint); font-weight: 400; font-size: 13px; }
.controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

input[type="search"], select {
  font: inherit; font-size: 13px;
  padding: 5px 9px; border: 1px solid var(--rule); border-radius: 7px;
  background: var(--bg-panel); color: var(--ink);
}
input[type="search"] { min-width: 200px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.btn-primary, .btn-ghost {
  font: inherit; font-size: 13.5px; padding: 6px 14px;
  border-radius: 8px; cursor: pointer; transition: background .12s;
}
.btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); font-weight: 600; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--bg-panel); color: var(--ink-soft); border: 1px solid var(--rule); }
.btn-ghost:hover { background: var(--bg-sunk); }
.btn-ghost.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn-tiny { font-size: 12px; padding: 4px 10px; }
.btn-big { font-size: 15px; padding: 10px 28px; }

.lede { color: var(--ink-soft); font-size: 14.5px; max-width: 62ch; }
.lede-wide { max-width: 80ch; margin-bottom: 22px; }

/* ─────────────────────────── 演练 setup ─────────────────────────── */
.drill-setup { max-width: 660px; }
.drill-setup h2 { font-size: 22px; margin: 4px 0 8px; }
.setup-block { margin: 22px 0; }
.setup-label {
  display: block; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .09em; color: var(--ink-faint); margin-bottom: 8px;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.chip-row-tight { margin-top: 8px; }
.chip {
  font: inherit; font-size: 13px; padding: 5px 12px;
  border: 1px solid var(--rule); border-radius: 999px;
  background: var(--bg-panel); color: var(--ink-soft); cursor: pointer;
}
.chip:hover { background: var(--bg-sunk); }
.chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.chip-all { font-size: 12px; color: var(--ink-faint); }
.chip-note { font-size: 11px; opacity: .7; margin-left: 3px; }
.chip-n { font-family: var(--mono); font-size: 11px; opacity: .65; margin-left: 4px; }
.setup-count { font-size: 13px; color: var(--ink-faint); margin-top: 12px; }

/* ─────────────────────────── 演练 stage ─────────────────────────── */
.drill-bar {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 16px;
}
.drill-pos { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin: 0 auto; }

.qcard {
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.qcard-head { padding: 22px 26px 18px; border-bottom: 1px solid var(--rule-soft); }
.qcard-tags { display: flex; gap: 7px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  font-weight: 600; letter-spacing: .02em;
}
.tag-core   { background: var(--core-soft);   color: var(--core); }
.tag-deep   { background: var(--deep-soft);   color: var(--deep); }
.tag-killer { background: var(--killer-soft); color: var(--killer); }
.tag-group  { background: var(--bg-sunk); color: var(--ink-soft); }
.tag-id     { font-family: var(--mono); background: none; color: var(--ink-faint); padding: 2px 0; }

.qcard-q {
  font-family: var(--serif); font-size: 21px; line-height: 1.42;
  margin: 0 0 8px; font-weight: 500;
}
.qcard-qcn { font-size: 13.5px; color: var(--ink-faint); margin: 0; }

.qcard-prompt {
  padding: 16px 26px; background: var(--bg-sunk);
  font-size: 13.5px; color: var(--ink-soft);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.qcard-body { padding: 4px 26px 26px; }

.ans-block { margin: 22px 0 0; }
.ans-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--ink-faint); margin-bottom: 9px; font-weight: 600;
}
.beats { margin: 0; padding: 0; list-style: none; counter-reset: b; }
.beats li {
  counter-increment: b; position: relative;
  padding: 5px 0 5px 30px; font-size: 14.5px; line-height: 1.6;
  border-bottom: 1px dashed var(--rule-soft);
}
.beats li:last-child { border-bottom: none; }
.beats li::before {
  content: counter(b); position: absolute; left: 0; top: 7px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.script {
  font-family: var(--serif); font-size: 15.5px; line-height: 1.72;
  padding: 16px 20px; border-left: 3px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--ink);
}

.cn-explain { font-size: 14.5px; line-height: 1.78; color: var(--ink-soft); }
.cn-explain p { margin: 0 0 12px; }
.cn-explain p:last-child { margin-bottom: 0; }
.cn-explain strong { color: var(--ink); font-weight: 650; }
.cn-explain table { border-collapse: collapse; margin: 12px 0; font-size: 13px; width: 100%; }
.cn-explain th, .cn-explain td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; }
.cn-explain th { background: var(--bg-sunk); font-weight: 600; }

.fu { border-top: 1px solid var(--rule-soft); padding-top: 12px; margin-top: 12px; }
.fu:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.fu-q { font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 0 0 6px; }
.fu-q::before { content: "↳ "; color: var(--ink-faint); font-family: var(--sans); }
.fu-a { font-size: 14px; color: var(--ink-soft); margin: 0; line-height: 1.7; }

.callout {
  padding: 13px 17px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.68; margin: 18px 0 0;
}
.callout-trap  { background: var(--killer-soft); border-left: 3px solid var(--killer); }
.callout-lab   { background: var(--core-soft);   border-left: 3px solid var(--core); }
.callout-risk  { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.callout-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  font-weight: 700; display: block; margin-bottom: 4px; opacity: .82;
}
.callout-trap .callout-label { color: var(--killer); }
.callout-lab  .callout-label { color: var(--core); }
.callout-risk .callout-label { color: var(--accent); }

.grade-row {
  display: flex; gap: 10px; margin-top: 26px; padding-top: 20px;
  border-top: 1px solid var(--rule);
}
.grade-btn {
  font: inherit; font-size: 14px; font-weight: 600;
  flex: 1; padding: 11px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--bg-panel);
}
.grade-btn small { display: block; font-size: 11.5px; font-weight: 400; opacity: .7; margin-top: 1px; }
.grade-good { color: var(--good); } .grade-good:hover { background: var(--core-soft); border-color: var(--good); }
.grade-half { color: var(--half); } .grade-half:hover { background: var(--accent-soft); border-color: var(--half); }
.grade-bad  { color: var(--bad);  } .grade-bad:hover  { background: var(--killer-soft); border-color: var(--bad); }

/* ─────────────────────────── 题库 ─────────────────────────── */
.bank-count { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 14px; }
.bank-group-head {
  font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--ink-faint); font-weight: 700;
  margin: 26px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--rule);
}
.bank-group-head:first-child { margin-top: 0; }

.bank-item {
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-panel); margin-bottom: 8px; overflow: hidden;
}
.bank-item summary {
  padding: 12px 16px; cursor: pointer; list-style: none;
  display: flex; align-items: baseline; gap: 11px;
}
.bank-item summary::-webkit-details-marker { display: none; }
.bank-item summary:hover { background: var(--bg-sunk); }
.bank-q { font-family: var(--serif); font-size: 16px; flex: 1; line-height: 1.45; }
.bank-qcn { font-size: 12.5px; color: var(--ink-faint); display: block; margin-top: 2px; font-family: var(--sans); }
.bank-mark { font-family: var(--mono); font-size: 13px; width: 15px; text-align: center; flex: none; }
.mark-good { color: var(--good); } .mark-half { color: var(--half); }
.mark-bad  { color: var(--bad);  } .mark-none { color: var(--rule); }
.bank-body { padding: 4px 16px 18px; border-top: 1px solid var(--rule-soft); }

/* ─────────────────────────── 原文 ─────────────────────────── */
.paper-meta {
  font-size: 13px; color: var(--ink-soft); margin-bottom: 24px;
  padding: 14px 18px; background: var(--bg-panel);
  border: 1px solid var(--rule); border-radius: var(--radius);
}
.paper-meta .pm-title { font-family: var(--serif); font-size: 17px; color: var(--ink); display: block; margin-bottom: 4px; }
.paper-meta .pm-line { font-size: 12.5px; color: var(--ink-faint); font-family: var(--mono); }

.paper-sec { margin-bottom: 34px; }
.paper-sec-head {
  font-family: var(--serif); font-size: 18px; font-weight: 600;
  margin: 0 0 14px; padding-bottom: 6px; border-bottom: 2px solid var(--accent);
  display: inline-block;
}
.paper-sec-head .cn { font-family: var(--sans); font-size: 13px; color: var(--ink-faint); font-weight: 400; margin-left: 8px; }

.para {
  background: var(--bg-panel); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 18px 22px; margin-bottom: 12px;
}
.para-label { font-weight: 650; font-size: 14.5px; margin: 0 0 6px; }
.para-text {
  font-family: var(--serif); font-size: 15.5px; line-height: 1.78;
  margin: 0; color: var(--ink);
}
.para-hooks { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hooks-label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); font-weight: 600; }
.hook {
  font: inherit; font-size: 12.5px; padding: 3px 10px;
  border: 1px solid var(--rule); border-radius: 999px;
  background: var(--bg-sunk); color: var(--ink-soft); cursor: pointer;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hook:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.hook-id { font-family: var(--mono); font-size: 11px; opacity: .6; margin-right: 4px; }

/* ─────────────────────────── 联动 ─────────────────────────── */
.lab-item {
  background: var(--bg-panel); border: 1px solid var(--rule);
  border-left-width: 4px;
  border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px;
}
.lab-good { border-left-color: var(--core); }
.lab-warn { border-left-color: var(--killer); }
.lab-info { border-left-color: var(--deep); }

.lab-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.lab-step { font-family: var(--serif); font-size: 17.5px; font-weight: 600; margin: 0; }
.verdict {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  padding: 2px 9px; border-radius: 999px; white-space: nowrap;
}
.verdict-good { background: var(--core-soft);   color: var(--core); }
.verdict-warn { background: var(--killer-soft); color: var(--killer); }
.verdict-info { background: var(--deep-soft);   color: var(--deep); }
.verdict-hint { font-size: 12px; color: var(--ink-faint); }

/* 两栏并排是这一屏的重点：左边你做过的，右边作业提的，一眼对照 */
.lab-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lab-col {
  padding: 13px 16px; border-radius: var(--radius);
  background: var(--bg-sunk); font-size: 14px; line-height: 1.68;
}
.lab-mine   { border: 1px solid var(--core-soft); }
.lab-theirs { border: 1px solid var(--rule); }
.lab-col-k {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  font-weight: 700; margin-bottom: 6px;
}
.lab-mine   .lab-col-k { color: var(--core); }
.lab-theirs .lab-col-k { color: var(--ink-faint); }
.lab-col-v { color: var(--ink); }

.lab-why {
  margin-top: 14px; padding: 13px 17px;
  background: var(--accent-soft); border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 14px; line-height: 1.7;
}
.lab-why .callout-label { color: var(--accent); }
.lab-say {
  margin-top: 14px; padding: 14px 18px;
  background: var(--core-soft); border-left: 3px solid var(--core);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-family: var(--serif); font-size: 15px; line-height: 1.7;
}
.lab-tech { margin: 10px 0 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }

/* ──────────────────── 正文里的术语 + 就地解释 ──────────────────── */
.term-link {
  border-bottom: 1px dotted var(--accent);
  cursor: help; color: inherit;
}
.term-link:hover { background: var(--accent-soft); border-bottom-style: solid; }
.term-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

.term-pop {
  position: fixed; z-index: 80; width: min(360px, calc(100vw - 24px));
  background: var(--bg-panel); border: 1px solid var(--rule);
  border-radius: var(--radius); box-shadow: var(--shadow-pad);
  padding: 14px 16px 12px;
  opacity: 0; transform: translateY(-3px); transition: opacity .12s, transform .12s;
}
.term-pop.open { opacity: 1; transform: none; }
.tp-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.tp-en { font-family: var(--serif); font-size: 16px; font-weight: 650; }
.tp-cn { font-size: 12.5px; color: var(--ink-faint); }
.tp-group { font-size: 10.5px; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; }
.tp-x { margin-left: auto; width: 24px; height: 24px; font-size: 12px; }
.tp-def { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--ink-soft); }
.tp-def strong { color: var(--ink); }

window.ORAL.paper = [

/* ───────────────────────────────── Problem ───────────────────────────── */
{
  id: 'p-problem',
  section: 'Problem',
  cn: '问题',
  paras: [
    {
      id: 'p1',
      text: 'Saccharomyces cerevisiae is an attractive chassis for oral antigen delivery. It is robust, inexpensive to produce, naturally particulate, and there is already a well-established system for displaying heterologous proteins on its surface. In principle, an antigen could be delivered as a freeze-dried yeast preparation without requiring a cold chain or a lipid formulation.',
      hooks: ['a1', 'a2', 'b5', 'a5'],
      risk: '"naturally particulate" 是你在暗示 β-glucan / mannan 有佐剂作用，但你没写出来。考官如果追问 "why does particulate matter"，你要能补上：颗粒能被 M cell 和树突细胞摄取，β-1,3-glucan 是 Dectin-1 的配体——这是酵母自带佐剂的分子基础。'

    {
      id: 'p2',
      text: 'One problem is that the displayed antigen may not remain attached to the yeast during passage through the gastrointestinal tract. Yeast surface display uses Aga2p, which is anchored to the cell wall through Aga1p [1]. In the standard pCTCON2-type system, the displayed protein is flanked by an N-terminal HA tag and a C-terminal c-Myc tag [2]. A short flexible linker is useful for keeping the displayed protein accessible and allowing it to move relatively independently of the cell surface. At the same time, flexible peptide sequences can be good substrates for proteases. An oral particle would first encounter pepsin under acidic gastric conditions and later pancreatic proteases in the small intestine. The yeast cell itself may remain intact even if the displayed antigen is cleaved away, leaving an intact particle with little or no antigen on its surface.',
      hooks: ['b1', 'b2', 'b3', 'a4', 'e1'],

      id: 'p3',
      text: 'This makes the linker an interesting target for engineering. It is a short sequence that can be changed without changing the antigen itself. However, rational design would be difficult because pepsin and the pancreatic proteases have different and partly overlapping sequence preferences. A sequence that works well against one enzyme may not perform well against the others. Instead of trying to predict a single optimal sequence, I would therefore use directed evolution and let the protease challenge determine which linker variants perform best.',
      hooks: ['c1', 'e6', 'c4', 'a3'],
      risk: '这是你全篇最强的一句 logic。"partly overlapping sequence preferences" 你必须能立刻举例：pepsin 和 chymotrypsin 都爱切芳香族（Phe/Trp/Tyr），这是 overlapping；trypsin 只切 Lys/Arg，这是 different。举不出例子，这句就变成空话。'
    }
  ]
},

/* ──────────────────────────── Possible Approaches ─────────────────────── */
{
  id: 'p-approaches',
  section: 'Possible Approaches',
  cn: '备选方案',
  paras: [
    {
      id: 'p4',
      label: '1. Shorten or stiffen the linker by design.',
      text: 'Removing residues or introducing prolines might reduce protease accessibility, but it could also affect the flexibility and accessibility of the displayed protein. It would also require choosing a sequence without knowing how it will behave in the presence of several different proteases.',

      risk: '"introducing prolines" —— 考官会问 why proline specifically。答案是两层：① Pro 使主链构象受限，蛋白酶活性位点要求底物以伸展构象进入 cleft，刚性链进不去；② 多数丝氨酸蛋白酶不切 X-Pro 键（trypsin 遇到 Lys-Pro / Arg-Pro 就不切）。你要能说出第二层，那才是分子层面的答案。'

      label: '2. Protect the whole particle instead.',
      text: 'An enteric coating or another form of encapsulation could reduce exposure to gastric conditions, but it does not solve the problem of antigen cleavage after the particle reaches the small intestine.',

      risk: '"directly couples the selection to the property" —— 这就是 genotype–phenotype linkage 的另一种说法。考官可能直接问 "what makes this coupling work"，你要回到质粒在细胞里、表型在细胞表面这一点上（b6）。'

/* ───────────────────────────── Why This Approach ──────────────────────── */
{
  id: 'p-why',
  section: 'Why This Approach',
  cn: '为什么选这条路',
  paras: [
    {
      id: 'p7',

  cn: '**主动说出来。** 这句话在原文第 9 段已经写了，口试开场就该复述一遍。\n\n为什么重要：一旦考官认为你在声称做疫苗，他就有权问你 IgA 应答、剂量、动物模型、佐剂——那些你都没准备。你先把 scope 钉死，这些问题就全部变成 "future work"，回答起来毫无压力。\n\n这是答辩里最有性价比的一个动作：**用限定 scope 换掉一整条追问线**。',
  followups: [
    { q: 'So what would convince you the project succeeded?', a: '一条 linker，在 pepsin/pH 2 三十分钟加 pancreatin/pH 6.8 一小时之后，c-Myc/HA ratio 显著高于野生型 (G4S) linker，并且用抗-抗原抗体验证过表位仍然可及。两个条件都要满足。' }
  ],
  trap: null,
  lab: null
},

/* ═══════════════════════════ B · 展示系统 ═══════════════════════════ */

  id: 'b1', group: 'B', level: 'core',

  ],
  script: 'From the wall outwards: the cell wall, then Aga1p, which is attached through a GPI anchor. Aga1p is joined to Aga2p by two disulfide bonds. Aga2p is fused at its C-terminus to the display cassette: a short linker, then the HA tag, then the linker I am randomising, then the antigen, then the c-Myc tag at the very C-terminus. So HA is proximal — close to the wall — and c-Myc is distal. Everything in my readout follows from that geometry.',
  cn: '这题你一定要能**边说边画**。考官给纸笔就画，不给就用手比划。\n\n注意一个原文没写清、但你必须讲清的点：pCTCON2 里 Aga2 和插入片段之间**本来就有一段 linker 加 HA tag**。你随机化的那一段必须在 **HA 之后、抗原之前**——如果你改的是 Aga2 和 HA 之间那段，切断以后 HA 和 c-Myc 会一起掉，细胞变双阴性，你的 ratio 读数就废了（见 f2）。\n\n**GPI 锚**：glycosylphosphatidylinositol，翻译后加在蛋白 C 端的糖脂锚，在酵母里最终被转到细胞壁的 β-1,6-glucan 上，所以 Aga1p 是共价固定在壁上的，不是插在膜里。',
  followups: [
    { q: 'Which linker exactly are you randomising?', a: 'HA 和抗原之间那一段。理由就是上面说的：只有切在 HA 和 c-Myc 之间，才会产生"HA 保留、c-Myc 丢失"这个可读的信号。' },
    { q: 'What is the wild-type linker sequence?', a: '典型是 (G4S)n —— Gly-Gly-Gly-Gly-Ser 重复。全部由最小侧链的 Gly 和 Ser 组成，所以极柔性、无二级结构倾向。也正因为极柔性，它对蛋白酶是理想底物。' }
  ],
  trap: '不要把 Aga1p 说成"插在膜上"。它是 GPI 锚定后转移到**细胞壁**上的，共价连在葡聚糖上。说成膜蛋白是常见错误。',
  lab: '技术 5B.2。这段你手册里已经背过：AGA1 GPI 锚在壁上，AGA1–AGA2 之间两对二硫键。'
},
{
  id: 'b2', group: 'B', level: 'core',
  q: 'How is Aga2p held onto Aga1p? What holds Aga1p on the wall?',
  qcn: 'Aga2p 靠什么连在 Aga1p 上？Aga1p 又靠什么留在壁上？',
  beats: [
    'Aga2p ← 两对二硫键 → Aga1p',

    '两者都是共价的，所以整条链很结实',
    '弱点不在锚定，在中间那段肽'

  script: 'Two disulfide bonds link Aga2p to Aga1p, and Aga1p is held to the wall through a GPI anchor that is transferred onto cell wall glucan — so it is covalently attached, not membrane-inserted. Both junctions are covalent. That is actually the point of my proposal: the anchoring chemistry is strong, so the weak link is not the anchor, it is the ordinary peptide bond in the flexible linker. A protease does not care how good your anchor is if it can cut upstream of the antigen.',
  cn: '最后那句是这题的题眼，**一定要说出来**：锚定是共价的、很结实；失效点在肽键。这直接论证了为什么 linker 才是要工程化的对象（回到 a3）。\n\n补一个可能被追问的：既然是二硫键，还原剂（比如肠腔里的谷胱甘肽、或者食物里的还原性物质）会不会把 Aga2 整个还原下来？这是一个真实的替代失效路径，值得承认——而且它会让细胞变**双阴性**，和近端切割一样，从 gate 里消失而不是得高分。',
  followups: [
    { q: 'Could reducing conditions in the gut release Aga2p entirely?', a: '有可能。小肠腔里存在还原性环境和谷胱甘肽。但注意它的表现和"近端切割"一样：HA 和 c-Myc 同时丢失 → 双阴性 → 掉出 gate。它不会污染你的高 ratio 群，只会降低回收率。要区分的话，可以做一个 +DTT 不加蛋白酶的对照。' }

},
{
  id: 'b3', group: 'B', level: 'core',
  q: 'Where are the HA and c-Myc tags, and why does their position matter?',
  qcn: 'HA 和 c-Myc 分别在哪，位置为什么重要？',
  beats: [
    'HA 在 N 端侧、靠近 Aga2p —— proximal',
    'c-Myc 在 C 端最末 —— distal',

    '所以 c-Myc/HA 是一个"远端还在不在"的空间读数'
  ],
  script: 'In the pCTCON2 design, HA sits between Aga2p and the insert, and c-Myc is at the extreme C-terminus, after the insert. So they bracket everything I care about. Any cleavage between them removes the c-Myc epitope from the cell while leaving HA attached. That converts a chemical event — one peptide bond broken — into a two-colour spatial readout on a flow cytometer. HA is my internal reference for how much construct was there to begin with; c-Myc is the survivor.',
  cn: '"bracket" 这个词很好用——两个 tag 把感兴趣的区域夹在中间。\n\n序列本身值得记住：\n- **HA tag** = YPYDVPDYA（来自流感血凝素）\n- **c-Myc tag** = EQKLISEEDL（来自人 c-Myc，经典抗体 9E10）\n\n能报出序列是加分项，但更重要的是能说清 **为什么这个几何让化学事件变成可测信号**。这是整篇作业最漂亮的一步设计。',
  followups: [
    { q: 'Which antibodies?', a: 'c-Myc 常用 9E10（鼠单抗）或鸡多抗；HA 用 12CA5 或市售抗-HA。两个一抗必须来自不同物种，才能用不同种属特异的二抗分开检测——不然两个通道会互相串。' },
    { q: 'Can you use directly conjugated primaries?', a: '可以，而且更好：省一步、没有二抗交叉、染色时间短。缺点是没有二抗放大，信号弱一些。你的实验里 SpyCatcher-FITC 走的就是"直接标记"路线。' }
  ],
  trap: '两个一抗如果来自同一物种，二抗会同时认两个——通道就废了。考官可能会顺手问一句，别掉进去。',
  lab: '技术 5B.4 / 技术 1。你的 expression sort 用 SpyTag/SpyCatcher-FITC 做展示量报告，作用和这里的 HA 完全等价：**归一化展示量的内参**。这是一个很强的类比，可以主动提。'
},
{
  id: 'b4', group: 'B', level: 'core',
  q: 'What drives expression? How do you induce, and what represses it?',
  qcn: '什么启动子？怎么诱导，什么抑制？',
  beats: [
    'GAL1 启动子',
    '半乳糖诱导、葡萄糖抑制（分解代谢物阻遏）',
    'SDCAA（葡萄糖）扩增文库、不展示；1/9 或 SGCAA（半乳糖）诱导展示',
    '低温诱导（20 °C，48 h）利于二硫键正确折叠',
    '和 lac 操纵子逻辑镜像'
  ],
  script: 'The cassette is under the GAL1 promoter — induced by galactose, repressed by glucose through catabolite repression. So I grow and amplify the library in glucose medium, where nothing is displayed and the cells are just dividing, and then switch to galactose medium to induce. Induction at 20 °C for around 48 hours rather than 30 °C, because slower folding gives better disulfide formation and better surface display. It is the mirror image of the lac operon: preferred carbon source present, gene off; only the secondary sugar switches it on.',
  cn: '这题是 PESB 高频，因为它把**调控**和**实操**接在一起。\n\n为什么把生长和展示分开很重要：展示是有代价的（分泌途径负担、错误折叠的 UPR 压力）。如果一直诱导，展示得差的细胞反而长得快，文库在扩增阶段就已经被扭曲了。用葡萄糖压住表达来扩增，就是保住文库多样性。\n\n**和 lac 对照**（考官很爱问）：\n- lac：乳糖（真正的诱导物是 allolactose）诱导，葡萄糖通过 cAMP-CAP 降低而间接抑制\n- GAL：半乳糖诱导（Gal3/Gal80/Gal4 开关），葡萄糖抑制\n- 共同逻辑：有首选碳源就关，没有才开',
  followups: [
    { q: 'Why 20 °C and not 30 °C?', a: '低温减慢翻译和折叠速率，给内质网里的 PDI（蛋白二硫键异构酶）和分子伴侣更多时间把二硫键配对正确。30 °C 展示量往往更低，因为错误折叠的被 ERAD 降解掉了。' },
    { q: 'Does the promoter leak?', a: '会。GAL1 在葡萄糖里有低水平泄漏。对你的方案影响不大（扩增阶段少量展示无所谓），但如果展示的蛋白有毒性，泄漏就会在扩增期造成选择压。' }
  ],
  trap: '别说 "半乳糖是诱导物所以加半乳糖" 就完事。要能说出**为什么要把生长期和诱导期分开**——那才是设计层面的理由。',
  lab: '技术 5B.3。你自己的诱导条件就是 1/9 培养基、20 °C、48 h、deep well 40 µL/1 mL。直接报出来。'
},
{
  id: 'b5', group: 'B', level: 'deep',
  q: 'Why yeast display rather than phage display?',
  qcn: '为什么用酵母展示不用噬菌体展示？',
  beats: [
    '抗原是折叠的真核蛋白：要二硫键、可能要糖基化',
    '噬菌体在大肠杆菌里做，原核没有这套折叠机器',
    '酵母是真核，有 ER、PDI、糖基转移酶',
    '而且 FACS 给你定量 + 活细胞分选；噬菌体只能 panning（二分，不定量）',
    '代价：酵母文库容量小两三个数量级'
  ],
  script: 'Two reasons. First, folding: the antigen is a eukaryotic protein that needs disulfides and probably glycosylation, and phage display is an E. coli system — the periplasm cannot reliably fold that. Yeast has an ER with PDI and the glycosylation machinery. Second, the readout: phage panning is a binary bind-or-wash step, whereas FACS gives me a quantitative, per-cell, two-colour measurement, which is exactly what my ratio selection needs. The cost is library size — yeast tops out around 10⁷ to 10⁸ transformants, phage reaches 10¹⁰ to 10¹¹. For a five-position linker library that trade is fine.',
  cn: '最后那句 **主动认代价** 是这题的分水岭。只说酵母好的人拿一般分；说 "酵母差在文库容量，但我的文库小所以不吃亏" 的人拿高分。\n\n而且这直接连到 d4：文库容量正好是你这个设计的临界约束——5 个 NNK 位点在 DNA 层面 3.4×10⁷，已经顶到酵母转化的天花板了。你能把 b5 和 d4 串起来讲，考官会看出你真的算过。',
  followups: [
    { q: 'What about ribosome or mRNA display?', a: '文库容量最大（10¹²–10¹⁴，无细胞、不受转化效率限制），但同样缺真核折叠环境，而且没有细胞可以分选——你的 ratio 读数完全做不了。' },
    { q: 'Mammalian display?', a: '折叠和糖基化最接近天然，但文库容量更小、成本高、周期长。对你这个只有 5 个位点的 linker 文库是杀鸡用牛刀。' }
  ],
  trap: null,
  lab: '技术 5B.5，你手册里标了"口试必背"。'
},
{
  id: 'b6', group: 'B', level: 'core',
  q: 'What is genotype–phenotype linkage, and why does your scheme need it?',
  qcn: '什么是基因型-表型偶联？你的方案为什么需要它？',
  beats: [
    '表型（linker 抗不抗切）在细胞表面',
    '基因型（编码它的序列）在同一个细胞里的质粒上',
    '细胞是把两者绑在一起的物理容器',
    '所以按表型分选细胞 = 同时富集了基因型',
    '断了这个连接，筛出来的东西就没法测序'
  ],
  script: 'Each yeast cell displays one linker variant on its surface and carries the plasmid encoding that same variant inside. The cell physically ties the phenotype — how much c-Myc survives the protease — to the genotype. So when FACS sorts on the ratio, it is also sorting the DNA, and I can recover plasmids from the sorted pool and sequence them. Without that linkage a selection is useless: you would find a resistant molecule and have no way to know what it was.',
  cn: '这是展示技术的**全部意义**，一句话说不清就等于没懂这门课。\n\n可以补一个反例来显示你理解得深：如果你把 linker 库做成游离肽在管子里筛，你能测出哪些肽抗切，但你**分不出是哪一条**——除非一条条合成、一条条测。展示技术做的就是把"筛"和"识别"合并成一步。\n\n再补一层：这也是为什么文库不能有"一个细胞多个质粒"。共转化多质粒会打破 1:1 偶联，一个细胞的表型是几种 linker 的混合，测序就归不了因。',
  followups: [
    { q: 'What breaks the linkage?', a: '一个细胞里进了多个不同质粒。控制办法是电转时降低 DNA 量、保持转化子远少于泊松单拷贝的界限，或者用 CEN 单拷贝载体而不是 2µ 高拷贝。' }
  ],
  trap: null,
  lab: '技术 5B.1。你的 RBD 文库靠的就是这个：FACS 分出结合强的细胞 → 提质粒 → Sanger 测序 → 知道是哪个重组体。'
},

/* ═══════════════════════ C · 为什么定向进化 ═══════════════════════ */
{
  id: 'c1', group: 'C', level: 'core',
  q: 'Why not just design a protease-resistant linker rationally?',
  qcn: '为什么不直接理性设计一条抗蛋白酶的 linker？',
  beats: [
    '不是一种酶，是一组酶',
    '偏好不同又部分重叠：pepsin 和 chymotrypsin 都爱芳香族；trypsin 只认 Lys/Arg；elastase 认小残基',
    '躲开一种可能撞上另一种',
    '而且不只有序列，还有构象可及性——这个更难预测',
    '所以让选择压去解，别让预测去解'
  ],
  script: 'Because the target is not one enzyme, it is a panel with partly overlapping specificities. Pepsin prefers hydrophobic and aromatic residues; chymotrypsin also cuts after aromatics; trypsin cuts only after lysine and arginine; elastase prefers small residues like alanine and glycine. If I design a sequence to avoid trypsin sites by removing every K and R, I have not touched what pepsin or chymotrypsin will do. And cleavage is not just about the P1 residue — it depends on whether that bond can be presented to the active site in an extended conformation, which is much harder to predict. Selection evaluates all of that simultaneously, for free.',
  cn: '这是全篇最强的一条论证，要练到能流利说出四种酶的偏好。\n\n**最后一层最值钱**：即使你把序列偏好全躲开，能不能被切还取决于**构象可及性**——蛋白酶的活性位点是一条 cleft，底物必须以伸展构象嵌进去。一段刚性的、或者贴着细胞壁被遮挡的 linker，就算含 Lys 也可能切不动。这是 sequence-based 预测根本算不出来的，而选择实验一次就把它测了。\n\n用一句话概括：**理性设计只能优化你会算的那个量；选择优化的是你真正要的那个量。**',
  followups: [
    { q: 'Could you use a protease-specificity prediction tool?', a: 'MEROPS 之类的数据库能给你 P1/P1\' 偏好统计，可以用来设计**初始文库的偏置**（比如避开明显的 K/R），但不能用来挑最终序列——它算不了构象和空间遮挡。合理用法是"用预测缩小搜索空间，用选择做最终决定"。' }
  ],
  trap: '别只说 "蛋白酶偏好不同"。要举出**具体的酶和具体的残基**，否则这句在考官听来就是套话。',
  lab: null
},
{
  id: 'c2', group: 'C', level: 'deep',
  q: 'Your approach 1 was to stiffen the linker with prolines. Why would proline help, mechanistically?',
  qcn: '你的方案一说加脯氨酸。从机制上，脯氨酸为什么有用？',
  beats: [
    '第一层：Pro 的侧链环回主链氮，限制 φ 角，主链刚性大',
    '蛋白酶要求底物以伸展构象进入 cleft，刚性链进不去',
    '第二层（更硬）：多数丝氨酸蛋白酶不切 X-Pro 键',
    '典型：trypsin 遇 Lys-Pro / Arg-Pro 不切',
    '代价：刚性也降低抗原的可及性和摆动自由度'
  ],
  script: 'Two levels. Structurally, proline\'s side chain cyclises back onto the backbone nitrogen, so it constrains the backbone and removes the amide hydrogen. A protease active site is a groove that needs the substrate in an extended conformation, hydrogen-bonded like a β-strand, and a proline-rich segment cannot adopt that easily. More specifically, most serine proteases will not cleave an X-Pro bond — trypsin, for example, skips Lys-Pro and Arg-Pro. So prolines both stiffen and directly block. The problem is that the same rigidity is what gives the antigen its freedom to move and be recognised, so I would be trading the property I want to keep against the property I want to gain.',
  cn: '第二层（X-Pro 不切）是把这题从"泛泛而谈"拉到"分子层面"的关键。丝氨酸蛋白酶的催化需要底物主链在 S1\' 位形成特定的氢键网络，Pro 没有 N–H，且环状侧链造成位阻，所以 P1\' 是 Pro 的键基本不被切。\n\n**收尾一定要说 trade-off**：Pro 化 linker 会同时降低柔性 → 抗原摆不开 → 可及性下降。这正好就是你原文 Possible Problem #1 的内容（i1），能在这里就把两处串起来，说明你自己的文档是一个整体。\n\n顺带：这也解释了为什么你**不排除** Pro 出现在筛选结果里——如果选择真的挑出富含 Pro 的 linker，那说明抗性确实赢了，但你必须紧接着做可及性验证。',
  followups: [
    { q: 'So if selection returns proline-rich linkers, is that a success or a failure?', a: '是个警报，不是结论。说明选择压确实在起作用（找到了抗切的解），但也正好落在 Possible Problem #1 预言的那个陷阱上。必须用抗-抗原抗体测可及性，把"抗切但藏起来"的变体剔掉。这就是为什么这个对照是必须的，不是可选的。' }
  ],
  trap: null,
  lab: null
},
{
  id: 'c3', group: 'C', level: 'deep',
  q: 'Approach 2 was an enteric coating. Why did you reject it?',
  qcn: '方案二是肠溶包衣。为什么不用？',
  beats: [
    '先承认它有效——它对胃是真管用',
    '但它按设计就是在小肠溶解的',
    '一旦溶了，胰酶直接接触抗原',
    '包衣解决第一段，解决不了第二段',
    '而且这两条其实互补，不是二选一'
  ],
  script: 'I did not reject it as useless — an enteric coating genuinely works against gastric acid and pepsin; that is exactly what it is designed for. The problem is that it is designed to dissolve above about pH 5.5, which is the small intestine, which is where the pancreatic proteases are. So the coating protects the particle through stage one and then hands it, unprotected, to stage two. It solves half of my problem. Honestly, the two approaches are complementary rather than alternatives — in a real product I would probably want both: a coating to get past the stomach and a resistant linker to survive the gut.',
  cn: '这题的正确姿态是 **不要为了选自己的方案而贬低别人的**。考官在测的是你的判断诚实度。\n\n"complementary rather than alternatives" 这句是加分的：显示你能跳出作业里"三选一"的框架，看到真实开发里它们会被叠加使用。\n\n技术细节可以点一句：肠溶包衣是 pH 响应型聚合物（如 Eudragit L/S 系列的甲基丙烯酸共聚物），在酸里质子化不溶，pH 升高后羧基去质子化而溶解。',
  followups: [
    { q: 'If both work, why is the linker the better thing to engineer?', a: '因为包衣是配方层面的、可以随时加上去的（工业上是成熟技术）；而 linker 是必须在分子层面解决、并且要花时间做的。先做难的、不可替代的那个。而且改好的 linker 是一次性的，之后每个批次都自带。' }
  ],
  trap: null,
  lab: null

  cn: '这题必须答得**精确到数字**，因为它是可算的，考官一听就知道你有没有真懂。\n\n算给自己看：\n- K = G 或 T → 排除所有第三位是 A 或 C 的密码子\n- TAA 第三位 A → 排除；TGA 第三位 A → 排除；TAG 第三位 G → **保留**\n- 所以 32 个密码子里恰好 1 个终止子\n\n**密码子偏倚**这一层是拉分点：NNN 下 Leu/Ser/Arg 各 6 个密码子、Met/Trp 各 1 个 → 6 倍失衡，文库在氨基酸层面是歪的。NNK 下最多 3 个密码子（Leu/Ser/Arg），最少 1 个 → 降到 3 倍。\n\n**NNS**（S = G/C）也是 32 个密码子、也只剩 TAG，和 NNK 基本等价。区别只在偏好哪些同义密码子；实践上 NNK 更常用。',
  followups: [

  script: 'The rule of thumb comes from a Poisson argument: if you sample N times from a library of diversity D, the chance a given variant is missed is e to the minus N over D. At N equal to 3D that is about 5%, so threefold oversampling gives 95% coverage. My DNA diversity is 3.4 × 10⁷, so I want on the order of 10⁸ transformants. That is right at the ceiling of yeast electroporation — an optimised protocol reaches around 10⁹, a routine one more like 10⁷. I would measure it directly: after transformation, plate a dilution series on selective plates and count colonies. If I could only get 10⁷, I would drop to four randomised positions, where the DNA diversity is about 10⁶ and tenfold coverage is comfortable.',
  cn: '★ 这题是整个文库部分的**制高点**。能把泊松算清楚、并且知道自己的设计正好卡在酵母转化的极限上，是研究生水平的回答。\n\n泊松推导（值得会）：把 N 个转化子随机分配到 D 个变体上，每个变体期望被抽到 λ = N/D 次。P(一次都没抽到) = e^(−λ)。\n- λ = 1 → 漏掉 37%\n- λ = 3 → 漏掉 5%\n- λ = 5 → 漏掉 0.7%\n\n**而且要主动认**：5 个位点是硬撑的。这不是缺陷，这是你写在原文里的那句 "library coverage would be an important practical consideration" 的具体含义——把那句含糊的话兑现成数字。\n\n退路（4 个位点）一定要说出来。有 fallback 的方案才像真做过实验的人写的。',

  cn: '这题你有**主场优势**——你自己就是这么建 RBD 重组文库的。要让考官知道这一点。\n\n几个能显示实操经验的细节：\n- **同源臂 ~40 bp**：酵母电转的常用长度，短于 30 bp 效率明显下降\n- **whole-plasmid PCR 线性化**：比酶切干净，因为不依赖唯一酶切位点，而且断点位置随你定\n- **线性化必须彻底**：残留的环状母本质粒会直接转化出野生型 linker 的假阳性。所以 PCR 产物要么用 DpnI 消化掉甲基化的模板（技术 4），要么跑胶切胶回收\n\n最后一句 "diversity carried by a cheap oligo" 是设计层面的洞察：文库多样性的瓶颈在寡核苷酸合成，而不在克隆效率——这就是为什么这个路线适合建库。',

    '② Rad51 丝：Rad51（RecA 同源物）在 Rad52 帮助下装载到 3\' ssDNA 上',
    '③ 链入侵 strand invasion：Rad51 丝搜索同源序列，侵入双链，形成 D-loop',

  script: 'Four steps. First, resection: the MRX complex — Mre11, Rad50, Xrs2 — together with Exo1 chews back the five-prime ends of the linear DNA, leaving three-prime single-stranded tails. Second, Rad51, the eukaryotic RecA homologue, is loaded onto that single-stranded DNA with help from Rad52, forming a nucleoprotein filament. Third, strand invasion: that filament searches for homology and invades the duplex, forming a D-loop. Fourth, DNA polymerase extends from the invading three-prime end, copying across the homologous region, and the gaps are sealed. Yeast is unusually good at this because it repairs double-strand breaks predominantly by homologous recombination, whereas mammalian cells lean on non-homologous end joining.',
  cn: '这题在你手册里标着 ★口试重点★，而且和作业直接相关，被问的概率很高。\n\n四步一定要按顺序背下来：**resection → Rad51 filament → strand invasion / D-loop → extension & ligation**。\n\n关键酶名要报得出：**Mre11-Rad50-Xrs2 (MRX)、Exo1、Rad51、Rad52**。注意 Rad51 是 RecA 的真核同源物——这个对应关系考官爱问。\n\n最后一句"酵母偏 HR、哺乳动物偏 NHEJ"是解释**为什么酵母能当克隆宿主**的根本原因，别漏。',
  followups: [

  cn: '"the best of the subset I happened to make" —— 这句话是这题的核心，也是定向进化里一个普遍而重要的原则：**文库大到超过采样能力，选择就退化成了随机抽样加局部优化**。\n\n这也解释了为什么"文库越大越好"是错的。大文库只在你能采样它的时候才有意义。\n\n如果考官逼你 "那如果我就是想探索十个位点呢"，正确答案是**分步**：先固定五个、筛出好的，再在赢家背景上随机化另外五个（迭代式饱和突变 / walking）。这样每一步都保持在可覆盖范围内。这是 CASTing / ISM 的思路，能提到就很漂亮。',

    '最后这一点是你灭活它的办法'
  ],
  script: 'Pepsin is an aspartic protease — two aspartate residues in the active site do the catalysis, which is why it needs a very low pH, optimum around 1.5 to 2.5. It is an endopeptidase with fairly broad specificity, preferring hydrophobic and aromatic residues — phenylalanine, leucine, tryptophan, tyrosine — at both P1 and P1 prime. And usefully for me, it loses activity above pH 7 and is irreversibly denatured above about pH 8, so I can stop the gastric stage simply by neutralising, without adding an inhibitor that I would then have to wash out.',
  cn: '最后那句是**实操层面的金句**：pepsin 的灭活方式就是中和 pH，这既生理（对应食糜进入十二指肠被碳酸氢盐中和）又干净（不引入抑制剂残留）。这一点直接接到 f4——染色前必须确保蛋白酶已死。\n\n为什么 aspartic protease 需要酸：两个 Asp 中一个必须质子化、一个去质子化，才能协同活化水分子进攻肽键羰基。pH 太高两个都去质子化，机制就断了。\n\n**同类**：HIV protease、renin、cathepsin D 都是天冬氨酸蛋白酶。HIV protease 抑制剂就是这一类的经典药物靶点，可以顺口提一句显示知识面。',
  followups: [
    { q: 'Will your yeast survive pH 2?', a: '见 e4——这是必须单独回答的一题。' },
    { q: 'Does pepsin need calcium or a cofactor?', a: '不需要金属离子。它以 pepsinogen 酶原形式分泌，在酸性下自催化切掉 N 端前肽而活化——这是典型的酶原激活，防止腺体自我消化。' }
  ],
  trap: '别把 pepsin 说成丝氨酸蛋白酶。它是**天冬氨酸**蛋白酶——这是它需要极酸 pH 的原因，答错等于机制全错。',
  lab: null
},
{
  id: 'e2', group: 'E', level: 'core',
  q: 'What is in your "pancreatic protease mixture"? Give me the specificities.',
  qcn: '"胰酶混合物"里有什么？各自切什么？',
  beats: [
    'Trypsin：切 Lys / Arg 之后（C 端侧），遇 Pro 不切',
    'Chymotrypsin：切芳香族 Phe / Trp / Tyr 之后，Leu / Met 慢一些',
    'Elastase：切小残基 Ala / Gly / Val / Ser 之后',
    'Carboxypeptidase A / B：外肽酶，从 C 端一个个啃',
    '三种内肽酶偏好互补 —— 加起来几乎覆盖全部残基类型'
  ],
  script: 'Pancreatin contains trypsin, chymotrypsin, elastase and the carboxypeptidases, plus amylase and lipase which are irrelevant here. Trypsin is the narrowest — it cleaves only after lysine and arginine, and not if proline follows. Chymotrypsin cleaves after aromatics: phenylalanine, tryptophan, tyrosine, and more slowly after leucine and methionine. Elastase takes the opposite end of the size range, cleaving after small residues — alanine, glycine, valine, serine. All three are serine proteases with the classic Ser-His-Asp catalytic triad. Between them they cover basic, aromatic and small residues, which is precisely why designing a sequence to dodge all of them at once is hard.',
  cn: '★ **最后那句是整个方案的论证核心**（回到 c1）：三种酶的偏好加起来覆盖了碱性、芳香族、小残基三大类。你能躲开的残基所剩无几——这就是为什么理性设计难，为什么要用选择。\n\n特别注意 **elastase**：它偏好 Ala/Gly/Val/Ser。而野生型 linker 是 **(G4S)ₙ —— 全是 Gly 和 Ser**！也就是说标准的柔性 linker 恰好是 elastase 的理想底物。这个观察非常有力，主动说出来会让考官眼睛一亮：**你的问题不是假想的，标准构建体在设计上就是易切的。**\n\n**Ser-His-Asp 催化三联体**要能报出来：His 作碱夺 Ser 的质子，Ser 的氧亲核进攻羰基碳，形成酰基-酶中间体，Asp 稳定质子化的 His。这是生化里最经典的机制之一。',
  followups: [
    { q: 'So is your wild-type (G4S) linker a good elastase substrate?', a: '★ 是的，正是。全 Gly/Ser 组成，恰好落在 elastase 的偏好里，而且极端柔性意味着它能轻松以伸展构象进入活性位点 cleft。所以标准展示 linker 在胃肠道里是双重脆弱的：序列对，构象也对。这是我这个课题存在的理由。' },
    { q: 'What is the catalytic triad?', a: 'Ser-His-Asp。His 当广义碱活化 Ser 的羟基，Ser 亲核进攻底物羰基碳形成四面体中间体，坍塌后形成酰基-酶共价中间体并释放 C 端产物，然后水解掉酰基-酶。Asp 通过氢键稳定 His 的咪唑正离子。' }
  ],
  trap: '别只说 trypsin。考官问 "mixture" 就是要你列举。列不全会显得你写的时候没想清楚"混合物"里到底有什么。',
  lab: null
},
{
  id: 'e3', group: 'E', level: 'core',
  q: 'Why sequential — gastric then intestinal — rather than treating with everything at once?',
  qcn: '为什么先胃后肠依次做，不一次全上？',
  beats: [
    '因为生理上就是依次的：颗粒先过胃再进小肠',
    'pH 不兼容：pepsin 要 pH 2，胰酶要 pH 6.8',
    '一起加，两边都不在最适 pH，等于两个都没测准',
    '而且 pepsin 在 pH 6.8 下已经失活了',
    '依次做才是在选"两关都过得去"的 linker'
  ],
  script: 'Three reasons, and the first is that it is what actually happens: a particle goes through the stomach and then the small intestine, in that order. Second, the pH requirements are incompatible — pepsin needs about pH 2 and the pancreatic enzymes work around pH 6.8. Mixing them means neither is at its optimum, and in fact pepsin is already inactivated at 6.8. Third, and this is the selection argument: doing them sequentially means a variant has to survive both, in series. That selects for general resistance rather than resistance to whichever enzyme happened to dominate in a mixture.',
  cn: '三条理由要分层给：**生理真实性 → 生化不兼容 → 选择逻辑**。第三条最重要，因为它是"设计"层面的。\n\n"survive both, in series" 是关键短语：串联的选择压是 AND，不是 OR。混在一起做的话，一个只抗 trypsin 但极易被 pepsin 切的变体，可能因为 pepsin 在中性下没活性而蒙混过关。\n\n注意这也解释了为什么原文那句 "should favour linkers that can tolerate several different proteases rather than only one enzyme" 是对的——但你原文只写了结论，没写这三层理由。口试补上。',
  followups: [
    { q: 'How long at each stage?', a: '按生理时间：胃排空约 30 分钟到 2 小时（液体快、固体慢），小肠转运 2–4 小时。第一轮我会用偏温和的一端（胃 30 min、肠 1 h），后面几轮往生理时长加压。具体时长由 e5 的滴定实验定，不是拍脑袋。' },
    { q: 'Do you need to neutralise between stages?', a: '必须。把 pH 从 2 提到 6.8 既是下一阶段的条件，也顺手把 pepsin 不可逆灭活了。生理上这对应胰腺分泌碳酸氢盐中和食糜——所以这一步是"照抄生理"，不是人为加的。' }
  ],
  trap: null,
  lab: null
},
{
  id: 'e4', group: 'E', level: 'killer',
  q: 'Will your yeast even survive 30 minutes at pH 2? What is your evidence?',
  qcn: '你的酵母在 pH 2 下待 30 分钟还活着吗？证据呢？',
  beats: [
    '先诚实：这是必须先测的，不是可以假设的',
    '酵母耐酸性确实不错（它自己发酵会把环境酸化）',
    '但 pH 2 加 37 °C 是另一回事',
    '而且——关键——分选不需要细胞"活"，只需要"完整"',
    '真正的要求是细胞不裂解、表面表位不被破坏；活性只在扩增那一步才需要'
  ],
  script: 'I would not assume it — that is a control I have to run before anything else. Yeast is reasonably acid tolerant, since fermentation acidifies its own environment, but pH 2 at 37 °C for half an hour is a real stress and I would need a viability curve first. But there is an important distinction: FACS does not require the cells to be alive, only intact and stainable. What I actually need is that the cell does not lyse and the surface epitopes are not destroyed. Viability only matters at the amplification step, when I regrow the sorted pool. So the real experiment is: plate for CFU after the challenge to know my recovery, and if survival is too low, sort more cells to compensate, or shorten the gastric stage.',
  cn: '★ 这是一记 killer，因为它攻击的是一个你**没有在原文里处理**的前提。\n\n答好的关键是那个**区分**：分选要的是"完整可染"，不是"活"。这个区分显示你真的想过流式的物理过程——细胞死了照样能被激光测荧光、照样能被液滴偏转分出来。只有最后重新培养那一步才需要活性。\n\n然后给出**可执行的应对**：\n1. 先做存活曲线（不同 pH × 时间 → CFU）\n2. 挑战后铺板算回收率\n3. 存活太低就多分选一些细胞补偿，或者缩短胃段\n\n**姿态很重要**：不要辩护，直接说 "that is a control I have to run first"。承认一个未验证的前提，比硬撑一个猜测好得多。这也正是 CLAUDE.md 里那条"每个阈值都要有证据"的精神。',
  followups: [
    { q: 'If most cells die, does your selection still work?', a: '只要死亡是**随机的**（对所有 linker 变体一视同仁），它只降低回收率，不引入偏倚——多分选一些细胞就能补回来。危险的是死亡**不随机**：如果某些变体的细胞更耐酸，那就变成了 Possible Problem #2 描述的情况（i2），要靠 spike-in reference 株来监测。' },
    { q: 'Could you do the challenge on fixed cells?', a: '可以考虑，但要小心：固定（比如甲醛）会交联蛋白，可能既改变蛋白酶的可及性、又改变抗体的可及性——两个读数都被扰动。而且固定后没法扩增。更可能的用法是做一个固定的平行样，专门用来分离"细胞死亡"和"linker 切割"这两个效应。' }
  ],
  trap: '千万别说 "酵母很结实，应该没问题"。这就是 CLAUDE.md 说的"不要硬凑一个看起来合理的答案"。说"我不知道，这是第一个要测的"反而得分。',
  lab: '技术 5（电转后铺板计数）。CFU 计数你天天做。'
},
{
  id: 'e5', group: 'E', level: 'core',
  q: 'How do you choose the protease concentration and incubation time?',
  qcn: '蛋白酶浓度和时间怎么定？',
  beats: [
    '不猜，滴定',
    '拿未筛的文库（或者野生型 linker 单克隆）做一个二维梯度：浓度 × 时间',
    '每个条件测 c-Myc/HA ratio 分布',
    '选一个把阳性率压到 0.1–1% 的条件',
    '太温和 → 没有选择压；太狠 → 多样性一次杀光'
  ],
  script: 'I titrate rather than guess. I take the unselected library, or a clone with the wild-type linker, and run a two-dimensional grid of protease concentration against incubation time, reading the c-Myc to HA ratio distribution by flow cytometry at each point. Then I pick conditions where the high-ratio population is somewhere around 0.1 to 1 percent. Too mild and there is no selective pressure — everything passes. Too harsh and I lose the diversity in one round and end up selecting noise. And I would repeat that titration between rounds, because the population I am challenging has changed.',
  cn: '★ 这题直接对应 CLAUDE.md 里的第一条原则：**每个阈值都要有证据**。答案的形式必须是"我测这个量、我看它的分布、我把阈值放在这里、理由是"。\n\n0.1–1% 这个数字有根据：你自己的 expression sort 第 1–2 轮就是取 0.8–1.2%，第 3 轮富集到 33%。这是同一个量级的实践经验，**直接引用**。\n\n最后那句"每轮重新滴定"是深度：第二轮面对的群体已经比第一轮抗切了，用第一轮的条件就没有选择压了。加压不是拍脑袋乘二，是重新测。',
  followups: [
    { q: 'What does "more stringent" mean concretely between rounds?', a: '三个旋钮：提高蛋白酶浓度、延长孵育时间、或者收窄分选门。我会优先延长时间——它最接近生理变量（转运时间），而且不改变酶/底物比这个反应本身的性质。' },
    { q: 'How do you know the pressure was actually applied?', a: '看 mock-treated 对照和处理组的 ratio 分布有没有分开。如果两条曲线重叠，说明蛋白酶没起作用（酶失活了？浓度太低？），这一轮的分选结果无意义。这个对照每轮都要有。' }
  ],
  trap: null,
  lab: '技术 6.7（你的 expression sort：第 1–2 轮 0.8–1.2%，第 3 轮 33%）。这是你自己的数据，报出来最有说服力。'
},
{
  id: 'e6', group: 'E', level: 'killer',
  q: 'Aren\'t you just selecting for a linker with no lysines, arginines or aromatics? Do you need an experiment for that?',
  qcn: '你不就是在筛一条没有 K、R、芳香族的 linker 吗？这需要做实验？',
  beats: [
    '先承认：如果只有 trypsin 和 chymotrypsin，这个批评基本成立',
    '但 elastase 偏好小残基 —— 你躲掉 K/R/芳香族剩下的正好是它的底物',
    '所以序列层面没有"安全"的残基集合',
    '而且切不切还取决于构象可及性，那个算不出来',
    '选择同时评估序列和构象，而且是在真实的表面几何下'
  ],
  script: 'If the challenge were only trypsin and chymotrypsin, that criticism would largely be fair — I could design that on paper. But elastase cuts after small residues, alanine, glycine, valine, serine, which is exactly what is left once you remove the basic and aromatic residues. There is no residue set that is simply safe. And beyond composition, whether a bond is cleaved depends on whether it can be presented to the active site in an extended conformation, and on steric shielding by the antigen and the cell wall. None of that is predictable from sequence. Selection measures the actual property, on the actual surface, against the actual enzyme panel. What I would expect to learn is not just which residues, but which arrangements — and that is genuinely new information.',
  cn: '★★ 这是最狠的一刀，因为它质疑的是**整个课题有没有必要存在**。必须练熟。\n\n三层防御，按强度递增：\n1. **elastase 堵死了"避开危险残基"这条路** —— 这是最硬的事实反驳\n2. **构象可及性算不出来** —— 序列预测的根本局限\n3. **选择产出的是"排列"而非"成分"** —— 你会学到哪些**组合和顺序**有效，这是组合信息，不是清单信息\n\n第三层是升华：如果结果只是"别用 K/R"，那确实白做了。但如果结果是"某个特定的排列比同样组成的其他排列强十倍"，那就是设计学不到的东西。\n\n**开头先承认对方部分正确**。直接反驳一记好问题会显得防御性太强。',
  followups: [
    { q: 'So what would a boring result look like, and would you publish it?', a: '无聊的结果就是：富集出来的全是低复杂度的 Gly/Pro 序列，和纸面预测一样。那也是有价值的负结果——它说明这个系统里序列组成确实主导，构象效应可忽略。按 CLAUDE.md 的原则，负结果就照负结果报，不粉饰。' }
  ],
  trap: null,
  lab: null
},

{
  id: 'f1', group: 'F', level: 'core',
  q: 'Why sort on the c-Myc to HA ratio instead of c-Myc alone?',
  qcn: '为什么按 c-Myc/HA 比值分选，不直接看 c-Myc？',
  beats: [
    '因为细胞之间的展示量本来就差很多',
    '只看 c-Myc，展示量高的细胞会赢，不管它的 linker 好不好',
    'HA 是"原来有多少"的内参',
    '比值 = 剩下的 / 原来的 = 保留率',
    '这正是我要选的性质'
  ],
  script: 'Because display level varies a lot from cell to cell — plasmid copy number, where a cell is in the cycle, how well that particular fusion folded. If I gate on c-Myc alone, I select cells that started with more construct, not cells whose linker survived. HA is proximal to the anchor, so it reports how much construct was there before the challenge, and it stays put whatever happens downstream of it. The ratio is therefore surviving over starting — a per-cell retention fraction — and retention is exactly the property I am trying to improve. It is the same logic as normalising binding to expression.',
  cn: '最后那句类比是你的**主场**：这就是你 binding sort 里做的事。ACE2-CF640R 的结合信号必须除以 SpyTag-FITC 的展示量，否则展示得多的克隆看起来结合就强。**完全同构**。\n\n主动说出这个类比：\n> "This is the same normalisation I use in my own work — we display RBD variants and measure ACE2 binding, and we always normalise to a SpyTag-based display reporter, because otherwise you select for expression, not affinity."\n\n这一句同时证明了三件事：你懂这个原理、你做过、而且你能把课堂内容和自己的研究连起来。这是口试里最值钱的动作。',
  followups: [
    { q: 'Is the ratio really independent of expression level?', a: '近似独立，但不是严格独立。极低表达的细胞两个信号都接近背景，比值噪声会炸（小数除小数）。所以实际操作要先在 HA 上设一个下限门，只在展示量足够的细胞里算比值。这个细节能说出来就很专业。' },
    { q: 'How do you gate on a ratio in practice?', a: '在 c-Myc 对 HA 的双参数散点图上画一个**对角门**——收集落在 y=kx 这条线上方的细胞。流式软件里也可以直接用衍生参数（比值通道），但对角门更直观、更好解释。' }
  ],
  lab: '技术 5B.4 + 技术 29。你的 binding sort 用 SpyTag-FITC 归一化展示量，逻辑完全一致。'
},
{
  id: 'f2', group: 'F', level: 'killer',
  q: 'A cell has low c-Myc and normal HA. Give me three explanations other than "the linker was cut".',
  qcn: '一个细胞 c-Myc 低、HA 正常。除了"linker 被切了"，还有哪三种解释？',
  beats: [
    '① 提前终止：NNK 的 TAG 让翻译在 linker 处停住 —— 根本没做出 c-Myc',
    '② 抗原本身被切了：切点在抗原内部，不在 linker 里',
    '③ 表位可及性变了：c-Myc 还在，但被遮住或构象变了，抗体认不上',
    '④（送分）抗体被残留蛋白酶降解了',
    '每一种都有对应的对照'
  ],
  script: 'First, premature termination — NNK includes the amber codon, so about fifteen percent of my library truncates in the linker and never makes c-Myc at all. That is why I pre-sort for double positives before the challenge. Second, cleavage inside the antigen rather than in the linker: the antigen is a much larger protease target than the linker is, and cutting anywhere between HA and c-Myc gives the same signal. Third, loss of epitope accessibility — the c-Myc peptide is still covalently attached but is shielded or in a conformation the antibody does not bind. And fourth, which is my own procedural risk: residual protease degrading the detection antibodies during staining. Each of those needs a different control.',
  cn: '★★ 这题是整篇作业**最重要的一题**。你原文第 8 段已经承认了 confound（"c-Myc loss would not by itself prove that the linker was cut"），所以考官几乎一定会顺着往下挖，问你"那有哪些"。\n\n第 ② 条最要命也最少人想到：**抗原比 linker 大得多，是大得多的蛋白酶靶点**。你的 ratio 读数无法区分"linker 被切"和"抗原被切"——两者都是 HA 保留、c-Myc 丢失。这意味着你的选择实际上是在选 "HA 和 c-Myc 之间整段都抗切"，而不只是 linker。\n\n这**不完全是坏事**：对口服疫苗来说，抗原本身抗切也是你想要的。但它意味着富集出来的可能有抗原区的突变——而你说了抗原不变（a3）。解决办法：测序时只测 linker 区，同时**用限制性内切酶或 PCR 验证抗原区没变**；或者接受它，把它讲成"我选的是整个 displayed module 的抗切性"。\n\n第 ④ 条连到 f4，是操作层面的，说出来显示你想过实验会怎么出错。\n\n对照清单：\n| 解释 | 对照 |\n|---|---|\n| 提前终止 | 挑战前 pre-sort 双阳性 |\n| 抗原内部切割 | 单克隆验证：western 看片段大小；只对 linker 区测序并核对抗原区 |\n| 表位可及性 | 用第二个远端 tag（不同表位）或抗-抗原抗体交叉验证 |\n| 抗体被降解 | mock 样品加蛋白酶后立即灭活，比较染色强度 |',
  followups: [
    { q: 'So is your selection really about the linker?', a: '严格说，是关于"HA 和 c-Myc 之间整段的抗蛋白酶性"。因为只有 linker 是随机化的，遗传变异只发生在 linker 上，所以**富集出来的差异必然来自 linker**——抗原对所有变体都一样，它构成的是恒定背景，不是变量。这个论证很关键：变异源限定了因果归属。' },
    { q: 'How would you prove the linker was cut, for your final candidates?', a: '单克隆做 western blot：挑战前后都跑，用抗-HA 探针看留在细胞上的片段的大小。切在 linker 里会给出一个特定分子量的短片段，切在抗原里给出更长的。或者更直接：把挑战后的上清收集起来做质谱，找切割产物的 N 端序列——那直接告诉你切点在哪。' }
  ],
  trap: '别答成只有一种。考官问 "three explanations" 是在测你有没有想过替代假说。这是 CLAUDE.md 第五条"不要硬凑一个看似合理的答案"的口试版本。',
  lab: null
},
{
  id: 'f3', group: 'F', level: 'core',
  q: 'Walk me through the staining. Antibodies, fluorophores, channels.',
  qcn: '染色怎么做？抗体、荧光基团、通道。',
  beats: [
    '两个一抗必须不同物种（比如鼠抗-c-Myc 9E10 + 兔/鸡抗-HA）',
    '两个二抗种属特异、标不同荧光（AF488 和 AF647）',
    '488 nm 激光激发 AF488，发射 ~519 nm',
    '640 nm 激光激发 AF647，发射 ~668 nm',
    '两条激光空间分离，串色小',
    '全程冰上、PBSF（PBS + BSA）洗，防止内化和非特异'
  ],
  script: 'Mouse anti-c-Myc, clone 9E10, and a rabbit or chicken anti-HA — different host species, which matters because the secondaries have to tell them apart. Then a goat anti-mouse conjugated to Alexa 488 and a goat anti-rabbit conjugated to Alexa 647. AF488 is excited by the 488 laser and emits around 519, AF647 by the 640 laser emitting around 668. Those two lasers are spatially separated in the instrument, so spillover between the pair is small. Everything on ice in PBS with BSA, to block non-specific binding and to stop any internalisation. And critically, the protease has to be fully quenched before any antibody goes in.',
  cn: '为什么选 **AF488 / AF647** 这一对而不是 FITC/PE：488 和 640 是两条不同的激光，在仪器里空间上分开激发，所以串色远小于同一条激光激发的两个染料（比如 FITC 和 PE 都靠 488）。选跨激光的组合是流式实验设计的基本功。\n\n**PBSF** = PBS + BSA（你手册里的写法）。BSA 封闭非特异吸附。冰上操作既减少内化，也减少解离。\n\n最后一句（灭活蛋白酶）是这题的题眼，f4 会专门问。',
  followups: [
    { q: 'Why not directly conjugated primaries?', a: '可以而且更干净：少一步、没有二抗交叉反应、孵育时间短。代价是没有二抗的信号放大。如果 tag 的表达量够高（yeast display 通常够），直接标记是更好的选择。' },
    { q: 'What single-colour controls do you need?', a: '每个荧光基团单独染的样品（用于补偿），加一个完全不染的样品（定义背景/自发荧光）。酵母的自发荧光在绿色通道不可忽略，所以未染对照不是可选的。' }
  ],
  lab: '技术 1（荧光标记）+ 技术 6.2。你自己用 CF488 / CF640R 这一对，同样是跨激光设计。'
},
{
  id: 'f4', group: 'F', level: 'killer',

  qcn: '你在蛋白酶处理之后用抗体染色。抗体也是蛋白。会发生什么？',
  beats: [
    '★ 直接承认：如果不灭活，抗体会被切碎',
    '结果：两个通道信号都掉，你测的是残留酶活性，不是 linker',
    '灭活 pepsin：把 pH 提到 ≥7（>8 不可逆）',
    '灭活胰酶：加 AEBSF/PMSF 或大豆胰蛋白酶抑制剂',
    '再加冰冷 PBSF 多次离心洗涤，物理去除',
    '验证：mock 样品——把酶灭活后再加进去，看染色强度有没有变'
  ],
  script: 'That is a real hazard, and if I did not handle it the whole experiment would report residual protease activity rather than linker resistance. The proteases would cleave both the primary and secondary antibodies, both channels would drop, and the ratio would be garbage. So the challenge has to be terminated properly: pepsin I quench by neutralising to pH 8, which inactivates it irreversibly, and the pancreatic serine proteases I quench with a serine protease inhibitor such as AEBSF, or soybean trypsin inhibitor for trypsin specifically. Then several cold washes in PBS-BSA to physically remove the enzymes before staining. And I would validate it: take pre-quenched protease, add it to an untreated sample, and check that staining intensity is unaffected. If it is, the quench works.',
  cn: '★★ 这是**操作层面最锋利的一刀**，而且原文完全没提。答不出来会显得你只在纸上想过，没在台面上想过。\n\n答案的结构值得记：**承认危险 → 说明后果 → 给出灭活手段 → 给出验证实验**。最后那步"怎么证明灭活成功了"是把回答从"我知道要灭活"提升到"我知道怎么确认"的关键。\n\n验证实验设计得很巧：把已灭活的蛋白酶加到未处理样品里再染色。如果染色强度和不加酶一样，说明灭活彻底。这是一个真正的对照，不是一句保证。\n\n**AEBSF**（4-(2-氨基乙基)苯磺酰氟）比 PMSF 好：水溶性更好、毒性低、在水溶液里更稳定。PMSF 半衰期短且要用异丙醇溶。能说出这个区别是加分的。',
  followups: [
    { q: 'Could the inhibitor itself interfere with staining?', a: 'AEBSF 是共价不可逆抑制剂，作用于丝氨酸蛋白酶的活性位点 Ser。它不认抗体（抗体不是丝氨酸蛋白酶），所以本身不影响染色。但为了保险，洗涤步骤还是要有——而且上面那个验证实验会同时把这个可能性一起测掉。' },
    { q: 'What if you just wash really well instead?', a: '风险在于蛋白酶可能吸附在酵母细胞壁上，洗不干净。而且洗涤本身耗时，在这段时间里残留的酶还在工作。化学灭活加洗涤，两道保险，比单靠洗涤稳妥得多。' }
  ],
  trap: null,
  lab: '技术 6.2 / 技术 1。你自己染完 bind 之后用 PBSF 洗一次再上机——同样的洗涤逻辑，只是你不需要灭活酶。'
},
{
  id: 'f5', group: 'F', level: 'core',
  q: 'Explain physically how a FACS sorter separates one cell from another.',
  qcn: '从物理上讲，FACS 怎么把一个细胞和另一个分开？',
  beats: [
    '① 流体动力学聚焦：鞘液包裹样品流，细胞被挤成单列',
    '② 激光询问：每个细胞过激光焦点，产生 FSC（大小）、SSC（内部复杂度）、荧光',
    '③ 喷嘴振动把液流打成均匀液滴',
    '④ 目标细胞进入某个液滴的瞬间，给整条液流充电',
    '⑤ 带电液滴经过高压偏转板，被电场偏转到收集管',
    '关键：测量和分离在空间上分开，中间有固定的"液滴延迟"'
  ],
  script: 'The sample stream is injected into a faster sheath stream, which hydrodynamically focuses the cells into single file. Each cell passes a laser focus, producing forward scatter, which scales with size, side scatter, which reports internal complexity, and fluorescence in each channel. Downstream of that, a piezo vibrates the nozzle so the stream breaks into uniform droplets at a fixed frequency. The instrument knows the delay between interrogation and droplet formation, so when a cell that satisfies the gate is about to be in a forming droplet, it charges the stream at that instant. The droplet carries that charge, passes between two high-voltage deflection plates, and is pulled sideways into a collection tube. Everything else goes to waste.',
  cn: '这题考的是你**是不是真的理解仪器**，而不是把它当黑箱。\n\n最关键的概念是 **drop delay（液滴延迟）**：测量发生在激光点，分离发生在几毫米之外的液滴断点，中间有一个必须精确校准的时间差。校准不准 → 充错液滴 → 纯度崩溃。这是分选前每次都要做的事（你的操作员 流式操作员 做的就是这个）。\n\n补充值得说的：**coincidence / abort**。如果两个细胞恰好在同一个液滴里，仪器会选择放弃（abort）而不是冒险，这就是为什么纯度和产率是 trade-off——纯度模式丢得多，产率模式收得多但脏。\n\n**FSC/SSC 的物理**：FSC 是小角度前向散射，主要由细胞截面大小决定；SSC 是 90° 侧向散射，由内部折射率不连续（细胞器、颗粒度）决定。酵母的 FSC/SSC 图上活细胞群很紧，碎片在左下角。',
  followups: [
    { q: 'What is drop delay and why does it matter?', a: '从激光询问到细胞所在的那段液流断成液滴，中间隔了固定的距离和时间，通常十几个液滴。仪器必须知道这个延迟才能在正确的时刻充电。校准偏一个液滴，你分选的就是它前面或后面那个细胞——纯度直接崩。' },
    { q: 'Why do doublets matter?', a: '两个粘在一起的细胞会被当成一个事件，荧光是两个的和，而且分选时两个一起进管。一个高 ratio 的细胞粘着一个低 ratio 的，就把污染带进了收集管。用 FSC-A 对 FSC-H 去黏连：单细胞在对角线上，双联体的面积相对高度偏大，落在对角线上方。' }
  ],
  lab: '技术 6.4，你手册里有完整的四步。你自己的样品是 流式操作员 上机，但原理你要能讲。'
},
{
  id: 'f6', group: 'F', level: 'core',
  q: 'What gates would you draw, and in what order?',
  qcn: '你会画哪些门？按什么顺序？',
  beats: [
    '① FSC-A vs SSC-A：圈出完整酵母，排除碎片和聚集物',
    '② FSC-A vs FSC-H：去黏连（doublet exclusion）',
    '③ HA 通道下限门：只保留展示量足够的细胞（否则比值噪声炸）',
    '④ c-Myc vs HA 双参数图上的对角门：收集高比值群',
    '顺序不能乱——每一步都在为下一步清理群体'
  ],
  script: 'Four, in order. First FSC-A against SSC-A to define intact yeast and exclude debris — after a protease challenge there will be more debris than usual, so this gate matters more here than in a normal experiment. Second FSC-A against FSC-H to exclude doublets. Third, a lower threshold on HA, because the ratio is a quotient and it becomes meaningless when both numbers approach background — I only compute it on cells that displayed enough to begin with. And fourth, on a c-Myc versus HA bivariate plot, a diagonal gate collecting the population above a chosen slope. Each gate cleans up the population for the one after it.',
  cn: '★ 第 ③ 个门是**这题的分水岭**。绝大多数人只会说前两个加最后一个。\n\n为什么需要 HA 下限门：比值是除法。当 HA 接近背景时，分母很小，一点噪声就让比值飞到天上——低表达的细胞会**假性地**出现在高比值群里。这是纯粹的数学假象，不是生物学。设一个 HA 下限就把它们排除了。\n\n这个洞察显示你理解"比值读数"的统计脆弱性，不只是会用它。\n\n**分选后还要做的**：把收集管里的细胞重新上机跑一遍（post-sort purity check），确认落在门里的比例。你手册里 expression sort 从 0.8–1.2% 富集到 33% 就是这么读出来的。',
  followups: [
    { q: 'How do you set the diagonal gate\'s position?', a: '用 mock-treated 对照定基线：未处理的文库在 c-Myc/HA 图上有一个分布，把门设在这个分布的上方尾部。这样"高比值"是相对于同一天、同一批染色的未处理群体定义的，而不是一个绝对数。这就是每轮都要带 mock 对照的另一个理由。' },
    { q: 'How wide should the gate be?', a: '这是纯度对多样性的权衡。第一轮我会设宽一些（收 1% 左右），保住多样性；后面几轮收紧。设太窄的第一轮可能把真正的赢家和噪声一起丢掉。' }
  ],
  lab: '技术 6.6。'
},
{
  id: 'f7', group: 'F', level: 'deep',
  q: 'Do you need compensation? Explain what it corrects.',
  qcn: '需要做补偿吗？它在修正什么？',
  beats: [
    '需要，只要不止一个荧光基团',
    '荧光发射谱是宽的、有拖尾的',
    'AF488 的发射尾巴会漏一部分进 AF647 的检测通道',
    '补偿就是按单染对照测出漏出比例，从每个通道里扣掉',
    '这里尤其重要，因为你的读数是**比值**——串色会系统性地扭曲比值'
  ],
  script: 'Yes, whenever there is more than one fluorophore. Emission spectra are broad and asymmetric, with a long red tail, so some AF488 emission is detected in the AF647 channel and vice versa. Compensation measures that spillover using single-stained controls — cells stained with only one fluorophore — and subtracts the appropriate fraction from each detector. It matters more than usual in my experiment because my readout is a ratio: spillover from the HA channel into the c-Myc channel would inflate the apparent ratio in exactly the cells that have the most HA, which is a systematic bias, not random noise.',
  cn: '★ 最后那句是这题的深度所在，**一定要说**。\n\n想清楚这个逻辑：如果 HA（AF647）的信号漏进 c-Myc（AF488）通道，那么 HA 越强的细胞，漏过去的越多，c-Myc 看起来越高 → 比值被虚高。而 HA 强的细胞就是展示量高的细胞。结果：**你精心设计的归一化被串色悄悄抵消了一部分**，你又回到了在选展示量。\n\n所以在比值读数里，补偿不是"锦上添花的规范操作"，是**读数正确性的前提**。\n\n选 488/640 跨激光组合的另一个理由也在这里：跨激光的串色本来就小得多，补偿量小，残余误差也小。这和 f3 接得上。',
  followups: [
    { q: 'What controls does compensation need?', a: '每个荧光基团一个单染样品，加一个未染样品。关键要求：单染对照必须和实验样品用**同一个染料、同样的亮度范围**（补偿珠或者真细胞都行，但不能拿一个亮十倍的对照去补一个暗样品）。' },
    { q: 'Is spectral unmixing better?', a: '光谱流式（spectral cytometry）测的是完整的发射谱，然后用整条谱做解混，而不是用几个检测器做减法。对高维多色实验优势明显。你这个两色实验用传统补偿完全够。' }
  ],
  lab: '技术 6.8（你手册里列了"为什么需要补偿"）。'
},
{
  id: 'f8', group: 'F', level: 'deep',
  q: 'How do you calculate enrichment, and what number would satisfy you?',
  qcn: '富集倍数怎么算？多少你才满意？',
  beats: [
    '富集倍数 = 分选后阳性率 / 分选前阳性率',
    '每轮都要在同样的门、同样的染色条件下测',
    '你自己的经验：expression sort 从 0.8–1.2% → 33%，约 30 倍',
    '满意的标志不是某个绝对数，是"分布整体右移"',
    '而且要看第二轮还有没有继续移动 —— 不动了说明到头了'
  ],
  script: 'Enrichment is the positive fraction after a round divided by the positive fraction before it, measured with the same gate and the same staining. But the number I would actually watch is whether the whole c-Myc-to-HA distribution shifts right between rounds, not just the fraction in one gate — a fraction can move because the gate is at the edge of a distribution. In my own work an expression sort went from about one percent to thirty-three percent over three rounds, roughly thirtyfold, and that is the sort of behaviour I would look for. The stopping signal is the distribution ceasing to move: if round three looks like round two, either I have converged or the pressure is no longer selective.',
  cn: '★ "看分布整体右移，不只看门里的比例" 是这题的核心洞察。\n\n为什么：门设在分布边缘时，分布轻微移动会造成门内比例的巨大变化（尾部效应），反过来分布大幅移动而门在中间时比例变化反而不明显。**比例是分布的一个粗糙投影**，直接看分布更诚实。\n\n这也呼应 CLAUDE.md 的第一条：阈值放在两个分离群体之间的空隙里才不敏感；放在斜坡上就必须承认它是个限制。门设在分布尾部，恰恰就是"放在斜坡上"。\n\n**停止判据**要能说：分布不再移动 → 要么收敛了（找到最优），要么选择压失效了（酶不工作了 / 剩下的都一样抗切）。区分这两者要看 mock 对照和处理组还分不分得开（e5 的 followup）。',
  followups: [
    { q: 'What if enrichment is huge in round one and then stops?', a: '很可能第一轮把多样性杀得太狠——剩下的是少数几个克隆，后面就没得选了。测序会立刻告诉你：如果 round 1 之后的序列多样性只剩几十种，那就是过度选择。补救是回到 round 0 用更温和的条件重来。' }
  ],
  lab: '技术 6.6（富集倍数）+ 你自己的 expression sort 数据。'
},

/* ═══════════════════════════ G · 迭代与测序 ═══════════════════════════ */
{
  id: 'g1', group: 'G', level: 'core',
  q: 'Why two or three rounds? Why increase stringency between them?',
  qcn: '为什么两到三轮？为什么每轮加压？',
  beats: [
    '一轮不够：门必须设宽才不丢多样性，宽门就意味着带进假阳性',
    '多轮：每轮的假阳性是随机的，真阳性是可重复的 —— 重复富集就把它们分开了',
    '加压的理由：上一轮的赢家已经比原始群体抗切，用同样条件就没有选择压了',
    '太多轮的风险：多样性塌缩、生长快的克隆接管',
    '两到三轮是经验上的甜点'
  ],
  script: 'One round cannot be both permissive enough to keep diversity and stringent enough to be clean, so I set a wide gate and accept false positives, then rely on iteration to remove them: a cell that got through by chance is unlikely to get through again, whereas a genuinely resistant one will. Stringency has to increase because the population changes — after round one the survivors are already more resistant than the starting library, so the original conditions no longer discriminate between them. And I stop at two or three because every extra round costs diversity and gives more time for fast-growing clones to take over regardless of their linker.',
  cn: '第一句是关键的**统计论证**：假阳性是随机事件，随机事件不重复；真阳性是性质，性质可重复。多轮筛选本质上是**用重复性把信号和噪声分开**。\n\n这个论证可以用概率讲：如果一个细胞每轮有 p 的概率蒙混过关，三轮之后是 p³。p = 0.05 的话，三轮后是 1.25×10⁻⁴。而真阳性每轮都接近 1。\n\n"population changes so the conditions must change" 是动态选择压的正确表述，比"每轮加压"这句口号有内容得多。',
  followups: [
    { q: 'What is the cost of a fourth round?', a: '多样性。每一轮都在丢序列，四轮之后可能只剩几个克隆，你就失去了"哪些序列特征重要"的统计信息——只剩几个孤立的赢家，看不出规律。而深度测序的价值恰恰在于看**趋势**，不是看冠军。' },
    { q: 'Could you sequence after every round?', a: '应该。round 0、1、2、3 全测，才画得出每条序列的富集轨迹。只测最后一轮你只知道谁赢了，不知道它是稳步上升还是最后一轮偶然跳上来的。' }
  ],
  lab: '技术 6.7。你的 expression sort 就是三轮。'
},
{
  id: 'g2', group: 'G', level: 'core',
  q: 'Sanger or NGS here? Why?',
  qcn: '这里用 Sanger 还是 NGS？为什么？',
  beats: [
    '文库层面：NGS —— 你要的是频率，不是序列',
    '单克隆验证：Sanger —— 一条一条读，读长够',
    '而且你的随机化区域只有 15 bp，Illumina 短读长完全够',
    'NGS 才能给"富集轨迹"：每条序列在每一轮的频率',
    '两者是分工，不是二选一'
  ],
  script: 'Both, for different jobs. For the pools I need NGS, because what I want is not a sequence but a frequency distribution — how often each linker variant appears in round zero, one, two, three. That is a counting problem, and only deep sequencing counts. The randomised region is only fifteen base pairs, so short Illumina reads are more than enough; read length is not a constraint here. Then for the handful of final candidates I use Sanger on individual colonies, because I want an unambiguous full-length read of the whole cassette to confirm nothing else changed.',
  cn: '"NGS 是计数问题，Sanger 是读序问题" —— 这个框架比列表格好用得多。\n\n你手册里的对比表值得记：\n| | Sanger | NGS |\n|---|---|---|\n| 原理 | 双脱氧链终止 + 毛细管电泳 | 边合成边测序，大规模并行 |\n| 读长 | 500–1000 bp | 150–300 bp (Illumina) |\n| 通量 | 一次一条 | 百万条 |\n| 你的用途 | 单克隆验证 | 文库频率分析 |\n\n这里有一个**对你特别有利的点**：15 bp 的随机化区正好适合短读长。Illumina 的短读长在你 RBD 重组文库里是个问题（重组体长、断点要跨读长定位），在这里完全不是问题。能指出这个对比，说明你理解读长约束是**任务相关**的，不是绝对的。',
  followups: [
    { q: 'What is the sequencing depth you need?', a: '要能可靠估计频率，每个变体至少几十条 reads。文库多样性 3×10⁶ 显然测不全，但你不需要测全——你要看的是**富集起来的那些**，它们频率高，深度 10⁷ reads 就足够把频率跨越三四个数量级的变化看清楚。' },
    { q: 'Any PCR bias concerns?', a: '有。扩增测序文库时循环数要尽量少（一般 ≤20），否则 GC 含量或二级结构不同的模板会被差异扩增，把频率扭曲。而且要做 technical replicate（同一份 DNA 独立扩增两次）来估计这个噪声。' }
  ],
  lab: '技术 10.2。你两种都做过：KYB 系列 NGS 做文库、LCJ471–497 共 27 个单克隆做 Sanger。直接引用。'
},
{
  id: 'g3', group: 'G', level: 'killer',
  q: '"Enriched" relative to what? What is your baseline?',
  qcn: '"富集"是相对于什么？基线在哪？',
  beats: [
    '★ 基线是 round 0：诱导后、pre-sort 之后、但未经蛋白酶挑战的文库',
    '不能拿理论期望频率当基线 —— 建库本身就不均匀',
    '富集比 = 频率(round N) / 频率(round 0)，通常取 log₂',
    '还需要第二个基线：mock-treated（走完所有步骤但不加酶）',
    '两个基线的差别：round 0 扣掉建库偏倚；mock 扣掉生长和操作偏倚'
  ],
  script: 'Round zero — the induced, pre-sorted library before any protease. Not the theoretical expectation, because library construction is never uniform: oligo synthesis has position-dependent bias and transformation is a random sample, so some variants start at ten times the frequency of others. Enrichment has to be a ratio of observed to observed, usually expressed as log two of frequency in round N over frequency in round zero. And I need a second baseline as well: a mock-treated arm that goes through every step — induction, staining, sorting on the same gate, regrowth — but with no protease. That tells me what changes from growth and handling alone, and anything enriched in both arms is not about protease resistance.',
  cn: '★★ 这是原文的一个**真空白**。第 14 段写了 "sequences that become enriched during selection"，但没说相对于什么。考官问这一刀，是在测你懂不懂"富集"是个**相对量**。\n\n两个基线的分工必须说清楚：\n- **round 0**：扣掉**建库偏倚**。寡核苷酸合成不是完美等比例的，转化是随机抽样的，所以起始频率本来就不均匀。\n- **mock-treated**：扣掉**生长和操作偏倚**。有些克隆就是长得快，有些在分选和洗涤中损失少。这些和蛋白酶无关，但会造成频率上升。\n\n**判据**：真正的抗性变体应该在处理组富集、在 mock 组不富集。两组都富集的 = 生长优势。这是一个干净的双臂设计。\n\n这一条完全对应 CLAUDE.md 第五条的精神：step13_schema.py 那个例子——一个看起来很强的结果（31/31, p=0.001）在正确的对照下消失了，然后照实报告。同样的纪律。',
  followups: [
    { q: 'What if a variant is enriched in both arms?', a: '那它是生长优势，不是抗性。要从候选里剔除，或者至少标记出来单独验证。这正是 mock 臂存在的意义——它把"看起来赢了"和"因为抗切而赢"分开。' },
    { q: 'How many reads for round 0?', a: 'round 0 是最重要的一个样品，因为它是所有比值的分母，深度不够会让低频变体的分母噪声很大、富集比虚高。我会给 round 0 最高的测序深度，并且做重复。' }
  ],
  trap: '不要答 "相对于野生型"。野生型 linker 在 NNK 文库里出现的概率是 (1/32)⁵ ≈ 3×10⁻⁸ —— 它基本不在你的文库里。基线必须是 round 0 的实测频率分布。',
  lab: '技术 10.7。你的 KYB403–407 就是 unsort 对照——同一个角色。'
},
{
  id: 'g4', group: 'G', level: 'deep',
  q: 'List the controls that would convince you the enrichment is real.',
  qcn: '哪些对照能让你相信富集是真的？',
  beats: [
    '① round 0 深度测序 —— 建库偏倚的基线',
    '② mock-treated 平行臂 —— 生长/操作偏倚的基线',
    '③ spike-in 参考株（固定 linker + 不同荧光标记）—— 监测整体存活和 ratio 漂移',
    '④ 野生型 (G4S) linker 单克隆，和文库平行处理 —— 阴性参照',
    '⑤ 一条已知抗切序列（如富 Pro）—— 阳性参照，证明检测得出差异',
    '⑥ 技术重复：独立的第二次分选，看是不是富集同一批序列'
  ],
  script: 'Six. Round zero sequenced deeply, as the construction-bias baseline. A mock-treated arm through every step without protease, as the growth-and-handling baseline. A spike-in reference strain with a fixed linker and a constitutive fluorescent marker, added at a known ratio, so I can track overall survival and any drift in the ratio readout across rounds. A wild-type G4S clone processed alongside as a negative reference — it should lose c-Myc. A proline-rich clone as a positive reference, to prove the assay can detect a difference at all. And a full technical replicate: an independent second selection from the same round-zero library. If the two replicates enrich overlapping sets of sequences, that is the strongest evidence; if they do not, I have been reading drift.',
  cn: '★ 第 ⑥ 条（独立重复）是**最强的证据**，也是最少人提的。\n\n为什么最强：前五个对照都在控制**已知**的混淆因素。独立重复控制的是**未知**的——如果两次独立选择富集出重叠的序列集合，那不管有什么你没想到的偏倚，它至少是可重复的。这是从"我排除了我能想到的解释"升级到"结果本身是稳定的"。\n\n第 ⑤ 条（阳性对照）也值得强调：如果你的 assay 连一条明显抗切的序列和野生型都分不开，那阴性结果毫无意义——你不知道是"没有抗性变体"还是"我测不出来"。**阳性对照定义的是检测下限。**\n\n这一整题是 CLAUDE.md 第三条"no silent failures"的口试版：每一步都要有能证明它真的发生了的断言。',
  followups: [
    { q: 'Which one would you run first if you only had time for one?', a: 'mock-treated 臂。因为没有它，你连"蛋白酶到底起没起作用"都不知道，其它所有对照都建立在这个前提上。' }
  ],
  lab: '技术 6 + 技术 10.7。你的 unsort 对照（KYB403–407）就是 mock 臂的同构物。'
